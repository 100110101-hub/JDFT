[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "qwb-engine"
version = "0.1.0"
description = "QuantumWorkbench 引擎的 Python 绑定（K6 冻结接口，abi3-py39）"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.maturin]
module-name = "qwb_engine"
features = ["pyo3/extension-module"]
