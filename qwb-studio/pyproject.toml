[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwb-studio"
version = "0.1.0"
description = "QuantumWorkbench Studio 的 Python 模型层（P-01：K3 契约的 pydantic v2 映射）"
requires-python = ">=3.9"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["qwb_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
