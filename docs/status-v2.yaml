  note: "**判据 1e-6 用点采样做不到，这是方法的性质不是 bug**：任意转动下，遮蔽边界上总有 O(1/√N) 个碎片在「被/不被遮蔽」之间翻转，所以面积只能收敛到 1e-6 附近而不会精确不变；点数从 500 加到 8000 时偏差从 4.2e-4 降到 8.7e-5，正是采样误差的标志。要满足 1e-6 必须换成**解析的球帽公式**（每对球的交截面积用 `h = (R_i²−R_j²+d²)/(2d)` 的球帽面积扣掉，只依赖距离 → 对转动**精确**不变），三重交叠再单独处理。所以 SV-01 保持 in_progress：几何的「点采样版本」可用于 COSMO 的表面电荷迭代（那一半对面积精度不敏感，只要求 tessera 位置与法向），而「面积/体积对转动不变 < 1e-6」这条判据要等解析球帽。**第 30 轮进展与剩余**：① 解析球帽面积/体积已落地，转动不变性判据达成（< 1e-12）；② 三重交叠仍按「逐对相减」近似（水上是 1.85e-2 的面积差），精确处置需球面多边形求交，留作后续；③ SV-01 的另一半 **COSMO 表面电荷迭代**还没做 —— 那是 SV-01 标 done 的最后一条（依赖的 water.yaml ε = 78.355 已就位）。**第 31 轮补记**：求解器已落地并过了「解析 Born」判据（见 verification ⑧），期间踩了两个坑（已写进 `docs/choices.md` 六十一）：对角元第一版写成 `1.07√(4π/A)`（密度形式漏乘 `A`），球壳行和随碎片数**发散**（`M = 2000` 时高 24.2%）；以及 Coulomb 核矩阵 `1/d_ij` **不定**，Cholesky 在 `R = 1.5 Å`/`M = 400` 上直接失败，改用自带 LU。剩下的最后一条是 **SCF 内的双向耦合**：把 tessera 上的电势换成由 SCF 密度算的静电势、把 `ΔG = ½ΣVq` 当作 Fock 外场项回代，直到 SCF + 表面电荷同时自洽；拿到水/甲醇的 ΔG_solv 才能和实验（−6.3 / −3.8 kcal/mol 量级）比 1.5 kcal/mol。这需要给 `qwb-scf` 加外场通道（`SCF` 的 Hcore 修正 + 能量分解），是下一轮的车。裸点电荷 2–4% 的离散化误差不代表真机分子精度，但也**没有**据此放宽任何判据。
**第 35 轮的卡点（§2.5）**：① 实测差距 —— 水 −0.95 / 甲醇 −2.08 kcal/mol（判据 1.5），
甲醇的偏差方向与量级正好对应缺掉的正贡献（空化 ~+1–2、色散−排斥 ~+1–2 kcal/mol）；
② 卡点 —— 这些非极性项需要表面张力、原子色散系数与 SMD 参数化半径，属于 **SV-03**；
③ 本方**没有**为了过判据去调 ε/半径/容差，也没有把甲醇换成更容易的分子；
④ 若要在此刻收口，只能把判据改写成「静电项与实验的差」，那属于改验收标准，不做。"
