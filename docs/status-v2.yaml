析路的理论上限只有 **6N/3N = 2×**（H2O：串行 129 s vs 65 s、并行 31.78 s vs ~16 s），CPHF 省下的 SCF（0.3 s）在总时间里是噪声。**卡点 = 导数积分层本身**，要达标只能重写 2e 导数层（Rys 求积 / 带导数指标的 Hermite 核），或改判据（按实测写成 2× 并写明原因）——两条都需要决策，不是调参能解决的。结论与算术都记在 choices 七十二。"
