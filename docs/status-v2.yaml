  verification: "**三条 GPU 结论各带实测，第四条（XC）本轮补测并给出成本分解**。① gemm 原语：GPU vs CPU 最大绝对差 **5.55e-16**（判据 1e-12），吞吐 512³ **10.8 GFLOPS** / 1024³ **124** / 2048³ **173**（RTX 3070 Laptop，8 GiB，CUDA 13.0）。② **AO→MO（T1）已接线**：GPU vs CPU **6.9e-17**、加速 **60.8×**（`qwb-response` 的 `gpu-kernel` feature 下走 cuBLAS，默认构建原样）。③ **J 构建判 wontfix（有实测）**：稠密 4 索引在 n=150 就占 47% 显存、n=200 需 12.2 GB（超 8 GiB）；RI-J 两次收缩是 gemv 形状、算术强度 **0.5 flop/byte**（n=60/100/150/200 同值）→ 内存带宽支配；实测 n=60/n_aux=180 时 naive 0.002 s vs GPU 核 0.209 s（**0.0×**，每次调用建/销 handle 与显存分配盖过 2e6 flops）；同卡 2048³ gemm 有 173 GFLOPS 是形状不同，不是 kernel 写得好。④ **XC（本轮补测）**：H2O、grid-normal、72 900 个格点，把网格 XC 拆成三段 —— AO 缓存（与密度无关、SCF 只付一次）**0.13 s**（STO-3G，n=7）/ **0.29–0.70 s**（def2-SVP，n=24，含 σ/τ 需求）；每步的缩并+泛函 **0.031/0.080/0.160 s**（n=7 的 svwn5/pbe/m06-2x）与 **0.199/0.490/0.678 s**（n=24）；其中**只算泛函** 0.008/0.030/0.101 s，占每步 XC 的 **26%/37%/63%**（n=7）与 **4%/6%/15%**（n=24）。⑤ 顺带修掉一处每步都在付的浪费：`evaluate_xc_cached` 曾对每个格点 clone 三个 `Vec`（φ、∇φ、∇²φ）并再拷进 Vec-of-Vec，等于每步 2·n_points·5n 个双精度的分配与拷贝（n=24、72 900 点约 70 MB/步）；改成借用缓存后每步 XC **0.038→0.031 / 0.098→0.080 / 0.182→0.160 s**（n=7，1.14–1.23×）与 **0.214→0.199 / 0.523→0.490 / 0.740→0.678 s**（n=24，1.07–1.09×），且 `xc_grid_bit_pattern` 证明 **E_xc 与 v_xc 逐位不变**（`0xc013_1c6c_993b_7753` 等四条锚点）。⑥ `cargo test -p qwb-scf` 全绿（含 2 条新测试）。"
  gap: "**XC 的 GPU 化卡在「需要自定义 kernel」，不是卡在算法**：收缩段（占每步 XC 的 85–96%，n=24）是 `O(n_points·n²)` 的稠密乘法，算术强度约 `n/4` flop/byte（n=24 时 **6 flop/byte**）→ 内存受限；它的第二步是**逐元素行点积**（`ρ_p = Σ_μ Φ_pμ (ΦP)_pμ`），BLAS 没有这个原语（gemm 只能给到 `(ΦP)`），所以必须写 elementwise kernel。而当前的 unsafe 白名单只批了 **BLAS FFI**（`libloading` + cuBLAS），写自定义 kernel 要引入 NVRTC 或预编译 cubin —— 那是**新的 unsafe 面**，按 R-16 需要人类批准并更新 `unsafe_allowlist.txt`。**收益上限也不高**：功能求值只占 4–15%（真实基组），单独 GPU 化它最多 ~1.15×；收缩段要赢还得把 Φ（14 MB）常驻显存、每步只传 ρ/σ/τ 与 P（P 仅 4.6 KB），否则 PCIe 往返吃掉收益（RI-J 已经实测过一次 0.0×）。**解开条件**：① 人类批准 NVRTC 级 FFI（或允许把 cubin 进仓库）；或 ② 换专业卡/更大体系使收缩段的绝对量级上去。在此之前维持 blocked，且**默认路径与 CPU 位模式一行未动**。"
  note: "**为什么先测再写**：附录 A 要求「加速比实测记账」，而 GPU 代码一旦接进默认路径就要重新论证 CPU 位级回归（`127a91e`）。本轮把 XC 拆成三段量完，结论是「功能求值占比小、收缩段是内存受限且需要自定义 kernel」——与 J 的结论同型（choices 九十一/九十二/九十三），所以同样按 §2.5 记 blocked 而不是硬写一个不会赢的 kernel。**已交付且可回退**：gemm 原语、T1（AO→MO）两条真正 gemm 密集的核（5.55e-16 / 6.9e-17，60.8×），以及本轮的 CPU 拷贝消除（位级不变）。门禁不依赖 GPU：`--features gpu-kernel` 打不开时自动走 CPU。"
