  gap: "**剩余（第 389 轮再订正；上一轮那句「缺热化学修正」是错的）**。`ΔG*_S` 的定义（Imperial 学位论文 eq. 4.63–4.65）是「1 atm 理想气体 → 1 M 溶液」，其中气相与溶液的分子内热化学项**互相抵消**（同一几何、同一频率），所以我们的 `G_EP + G_CDS` 就是 1 M ↔ 1 M 的转移能，不需要振动/热修正；缺的是**标准态换算** `RT ln(RT/p°) = +1.8943 kcal/mol`（已作为 K2 的显式函数与结果块的派生量落地，见上）。真正的剩余按依赖顺序：① **判据的参考集**：SV-03 要求「8 溶剂 × 3 分子的 ΔG_solv 与实验 MAE < 1.0 kcal/mol」，而 SMD 的 1.0 是**参数化层级**（mPW1PW91/MIDI!6D 级几何与单点）的能力；本项目当前的 STO-3G/HF 单点上，水/水的偏差是 −5.8336 vs 实验 −6.32（+0.49，未加标准态项）—— 要真的验证 1.0 需要**实验参考集**（MNSOL 的 ΔG*_S，公开但需按行钉 sha256）**且**把层级抬到接近参数化层级，而后者受 meta-GGA 格点成本（EX-03）与几何优化成本约束，这一轮没有硬塞；② **静电形式**：与 PySCF 的 SMD 在同层级差 **1.2961 kcal/mol**（实测，`docs/error-budget.md`），来源是表面表示（tesserae vs SWIG）—— 要缩小它得换解析表面或把 tesserae 提到数千量级，那是 SV-01 的解析 SASA 那一半；③ SV-02（解析梯度/opt）仍 blocked。所以 SV-03 保持 in_progress：**能力已交付、与同层级实现的一致性已分段量化（CDS 3.9e-4 / 静电 1.2961 kcal/mol），判据（对实验 MAE）缺的是实验参考集与层级**。"
