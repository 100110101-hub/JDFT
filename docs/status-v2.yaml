  verification: "**基线实测**（release 构建，`H2O/def2-SVP/HF`，实验几何，`grid-coarse`）：现有数值 Hessian 墙钟 **67.46 s**，dof = 9，18 个位移几何（每个 1 次 SCF + 1 次解析梯度装配），频率 4058.9 / 3972.2 / 1794.6 cm⁻¹。判据要求「比数值快 ≥ 20×」，所以解析 Hessian 必须 < **3.37 s** 才算达成。"
  note: "**关键发现**：现有实现已经是**半解析**的 —— `numerical_hessian_with_delta` 每个位移用的是 `analytic_gradient_flat_for`（解析梯度：1e/2e/Pulay 解析 + XC 几何项的固定密度差分），而不是纯数值梯度。所以 20× 不能靠「换更好的差分」拿到，必须**去掉每个位移的 SCF**：按 CPHF 做闭壳层解析二阶导 —— 每列 1 次 CPHF 求解（矩阵自由 PCG，复用 `qwb-response::cphf` 的 (A+B) 机制，只换右端为核位移的 Fock 导数）+ 二阶导积分项（可用解析一阶导矩阵的中心差分，代价与一次梯度装配同量级）。**另一条必须修的**：现在在**非驻点几何**上算 Hessian（实验几何未优化），Hessian 里混着梯度项，频率会偏；解析路径应当先把几何优化到 `max|grad| < 4.5e-4`（判据里的 `H2O/def2-SVP` 应在此前提下比较）。下一轮：①写 `cphf` 的核位移右端 + 闭壳层解析 Hessian 的最小组装（H2/STO-3G）；②与现有数值 Hessian 比 Frobenius 与频率；③量墙钟并对照 3.37 s。**第 53 轮（第一刀优化已落地）**：`two_electron_all` 用平动不变性（`∂/∂A+∂/∂B+∂/∂C+∂/∂D = 0`）省掉第 4 个槽位的导数，少 1/4 的 `primitive_component` 调用。实测（release，H2O/def2-SVP/HF）：解析梯度 **16.946 → 12.641 s（1.34×）**、Hessian **67.46 → 50.55 s（1.33×）**，频率逐位不变，五条梯度验收（g01_analytic_def2svp / g01_components / g01_nuclear_derivative / g01_analytic_pbe×3）全绿。**还差**：解析 Hessian 要 < 3.37 s。下一刀是 Hermite 表复用 —— 现在每个 primitive 组合的 Hermite 表被重算 24 遍（4 槽 × 3 轴 × 抬/降），一次求表可给出全部 12 个导数 → 预期 ~24×，梯度约 0.5 s、Hessian 约 2.1 s，正好跨过 3.37 s 门槛。**第 54 轮（第二刀，已落地）**：`primitive_component` 里 `derivative_boys(l,m,n)` 的**懒缓存**。先试「全表预计算」反而更慢（梯度 12.641 → **18.792 s**、Hessian 50.55 → **65.65 s**，1.49× 退化）—— 多数三元组用不上，预计算把 setup 做大了；改成「访问到才算」后：解析梯度 **12.641 → 11.612 s**、Hessian **50.55 → 44.487 s**（相对第一刀 1.14×，相对最初 67.46 s 累计 **1.52×**），频率逐位不变，`g01_*` 五条、`qwb-integrals` 全部测试绿。**仍差** 3.37 s 的门槛 13 倍：剩下的必须是**第 55 轮（第三刀，已落地）**：`qwb-integrals::hermite2e` 拆出 `PrimitiveContext`（预因子 + Hermite-Coulomb 核缓存，与幂次无关）并新增 `primitive_component_derivatives`，一次 setup 给出四个中心的三轴导数（`∂/∂D` 用平动不变性）；`analytic_gradient` 里原来 24 次独立 `primitive_component` 调用（4 槽 × 3 轴 × 抬/降）合并成 **1 次**，`quartet_derivative` 删除。实测（release，H2O/def2-SVP/HF）：解析梯度 **11.612 → 7.188 s**、Hessian **44.487 → 31.782 s**，相对最初 67.46 s **累计 2.12×**；频率逐位不变；`g01_*` 五条、`qwb-integrals` 全部测试绿。**门槛随基线一起变**：判据是「比数值快 20×」，现在的基线 31.78 s，所以解析 Hessian 要 **< 1.59 s**。**第 57 轮：判成量级不可能（§2.5）**——一次导数积分遍历 7.188 s ≈ 390 次 SCF，数值 Hessian 要 6N 次遍历、任何 CPHF 解析路至少要 3N 次遍历，所以解析路的理论上限只有 **6N/3N = 2×**（H2O：串行 129 s vs 65 s、并行 31.78 s vs ~16 s），CPHF 省下的 SCF（0.3 s）在总时间里是噪声。**卡点 = 导数积分层本身**，要达标只能重写 2e 导数层（Rys 求积 / 带导数指标的 Hermite 核），或改判据（按实测写成 2× 并写明原因）——两条都需要决策，不是调参能解决的。结论与算术都记在 choices 七十二。"
  r292c_note: "第292轮续二：CPHF 右端组装完成 —— `cphf_hessian::cphf_right_hand_sides` 给出 3N 个方向的 `F^x_{pq}`、`S^x_{pq}` 与 `B^x_{ai} = F^x_{ai} − ε_i S^x_{ai}`（展平约定与 `qwb-response::cphf` 一致）。补齐了核位置那一半 `V^x_nucleus`（单核项平动不变性），四条判据与梯度分量对上：STO-3G 1e 1.39e-13 / 2e 3.26e-13 / Pulay 3.62e-16 / 核位置 2.36e-13；def2-SVP 9.66e-14 / 3.50e-12 / 2.56e-16 / 1.96e-12。另加一条**独立**判据：在 R±δ 上重建 hcore 与 2e 张量、用参考密度建 Fock、参考 C 变换到 MO 后再中心差分（Richardson 外推），与解析 `F^x_{pq}` 的最大相对差 **1.90e-8**。仍缺：3N 次 (A+B) 求解（求解器已在 RS-01 验过）、显式二阶导项的 AO 组装、`W^x`/`ε^x` 项。"
  r292b_note: "第292轮续：CPHF Hessian 的第一层落地 —— `qwb-scf::cphf_hessian` 给出全部 3N 个核位移方向的 `S^x`/`h^x`/`G^x` 三张直角分量块，并用三条恒等式钉在已验的解析梯度上：`Σ P h^x = kinetic + nuclear_ao`、`Σ P G^x = 2·two_electron`、`Σ W S^x = −pulay`。实测逐项相对差（水，9 个方向）：STO-3G 1e 1.39e-13 / 2e 3.26e-13 / Pulay 3.62e-16；def2-SVP 1e 9.66e-14 / 2e 3.50e-12 / Pulay 2.56e-16（`cphf_hessian::tests` 两条测试）。抓到并修掉第一版的对角元翻倍（μ==ν 时同一元素被写两遍）。右端与 (A+B) 求解是下一步。"
  r298_note: "第298轮：分解式**二次重写**（bra E 表按 (a',b') 缓存、G 按 ket 分组每组一次、展开改定长数组）后实测 **12.2 s vs 朴素 11.9 s** —— 仍慢 2.8%，等价性成立（逐项 7.39e-12）。原因：每次原函数四元组要展开 324 个 term，分组/查找的记帐成本（~数万次比较）盖过了算术节省；而朴素版在低阶四元组（真实分布的大多数）上本来就只有几十次乘加。分解式是为高阶准备的重武器，真实分布里没有收益。生产路径已退回朴素实现（11.9 s）。**已排除路线清单**（都有实测）：GPU、单纯优化积分内核（共用路径，比值反降）、手挑四元组微基准外推、分解式（记帐成本）、换求和次序。20× 需要 2e 显式二阶导再快 12 倍，剩下的量级是重写整套导数积分引擎（Rys/Obara–Saika + 壳层分块预计算结构），与「写一个新积分库」同量级。RS-05 维持 blocked、判据不动（用户一百零七的决定）。"
  r297_note: "第297轮：`R_{lmn}` 从「每个三元组一次符号求值」换成**一块 O(L³) 递推表**（`RTable`：`S^{(s)}(l+1,m,n) = −2ρR_xS^{(s+1)}(l,m,n) − 2ρlS^{(s+1)}(l−1,m,n)`，关系式是推导出来的，并由永久测试对符号路径逐点验到 1e-12：3 组 (ρ,R) × 216 个三元组）。实测：一次解析梯度 1.72 → **1.05 s**、2e 显式二阶导 13.2 → **11.9 s**、3N 个块 1.65 → **0.98 s**、数值基线 31.0 → **19.4 s**、解析路径 16.0 → **12.9 s**。**比值 1.94 → 1.50×**（又验证了「共用优化恶化比值」的规律）。分解式在 R 表就位后仍然慢（14.8 vs 11.9 s），新瓶颈是每个 term 的 E 表构建与 Vec 分配；等价性仍成立（FD 1.89e-8）。20× 需要 < 0.97 s ⇒ 2e 显式二阶导还要快 12 倍。仍 blocked。"
  r296_note: "第296轮：写出并验证了 2e 二阶导的**分解式**（`primitive_component_second_derivatives_factored`：ket 一侧先收缩成 G，144 个分量退化成 L³ 加权和），与朴素版逐项一致到 **9.5e-12**（`h05_second_derivatives` 的对应对照）。但实测**慢 4.6 倍**：59.9 s vs 13.2 s（水/def2-SVP）。归因：朴素版只用 ~29 个真正用得到的 `R_{lmn}`，分解式要把整个 (t+τ) 块都摸一遍（l+m+n≤6 时 343 个三元组），而现在的 R 是「按定义符号求导」、单次成本随阶数指数增长（2^(l+m+n)）。所以分解式省了 L⁶ 的循环却放大了 R 的求值次数。AO 层已退回朴素实现（13.2 s）；分解式代码与等价性测试保留作下一步的零件。下一步顺序：先做一块 O(L³) 的 `R_{lmn}` 递推表（用符号求导**推出**关系式、再用现符号路径验到 1e-14，不凭记忆写），再做分解式。仍 blocked。"
  r295_note: "第295轮：两条优化 + 一条方法论。①`derivative_boys` 的 Kernel 项表只依赖 `(l,m,n)`，改成线程内模板缓存（系数 = sign × (2ρ)^k）：2e 二阶导 16.4 → 13.2 s、一次解析梯度 2.70 → 1.78 s。第一版把符号记了两次，被 `i03_general_l` oracle 与 `d03_two_electron` 的量级检查同时抓住。②`cphf_right_hand_sides_from_blocks`：右端复用块，2.6 → 0.008 s。**方法论**：这两条让数值基线也一起变快（31.0 s），所以 RS-05 的比值反而从 2.25× 掉到 **1.94×** —— 共用内核优化对「快 20×」的判据是零和甚至负的，只有「减少导数遍次数」或「Hessian 独有」的优化才值钱。当前解析路径 16.0 s，其中 2e 显式二阶导 14.3 s 占 89%；唯一的结构性杠杆是分解式（一侧先收缩成 G，144 个分量退化到 L³ 加权和，量级 5×，且只对 Hessian 有利）。仍 blocked。"
  r294_note: "第294轮：把 2e 二阶导从 **42.2 s 降到 16.4 s**（水/def2-SVP，release），办法是去掉`PrimitiveContext::integral` 每条积分的 `Vec` 分配（`hermite_1d_into` + 调用方 scratch）；插桩实测原来 `derivative_boys` 只占 12%、其余 88% 是分配。第一版把 16³ 定长表整块清零，反而拖慢到 52.2 s，改成只清用到的那几十格才对。顺带：3N 个块 6.6 → 2.6 s、右端 7.1 → 2.6 s。当前一次解析梯度 2.70 s ⇒ 数值 Hessian 基线 ≈ 48.5 s；解析路径（仍不完整：缺一电子/重叠显式二阶导、CPHF 求解、W^x/ε^x 项）≈ 21.6 s ⇒ **2.25×**（上一轮 0.56×）。剩余大头是「分解式」（把一侧先收缩成 G，144 个分量退化成 L³ 加权和，量级 5–10×）与 `derivative_boys` 的 5.4 s（Kernel 项表可按 (l,m,n) 缓存）。仍 blocked。"
  r293_note: "第293轮：2e 项的**显式**二阶导落地（`two_electron_hessian_contracted`），判据是「冻结密度下 2e 梯度对几何的中心差分」，实测最大相对差 **1.87e-8**（Richardson 外推；水/STO-3G 9×9 逐项），另加对称性检查。写它时踩到置换映射的坑（成员第 s 个位置 ≠ 规范第 s 个槽位），靠「解析 / 暴力参照 / 差分」三方对照一次定位。**成本实测推翻了一百一十 的5.34×**：AO 层（水/def2-SVP，326255 次基元调用）2e 二阶导 **42.2 s**、全部 3N 个块 6.6 s、右端 7.1 s，合计 ≈ 56 s，**比数值 Hessian 的 31.8 s 还慢 1.8 倍**（判据要快 20 倍，目标 < 1.59 s）。微基准量到 5.07× 是因为手挑四元组不代表真实分布：真实一阶导平均 5 µs、二阶 129 µs，比值 ≈ 26×。因此核加速的目标从 7× 改成 **42×**，唯一的实现路径是「带导数指标的 Hermite」（现在每个原函数四元组重算 ~300 个移位幂次积分，每个都重建 Hermite 表）；另外两条便宜的：右端不要重算块、`nuclear_center` 块现在是 N× 工作量。仍 blocked。"
  r292_note: "第292轮：二阶导数基元 `primitive_component_second_derivatives` 落地（不新增递推 —— 把抬/降幂恒等式当线性算子连用两次，移位积分去重）。三根独立桩全绿：中心差分最大相对差 5.87e-6、平动不变性、交换对称（`tests/h05_second_derivatives.rs`，4 绿 1 ignore）。成本实测（release，水/def2-SVP 的真实角动量组合，2000 次 × 4 个四元组）：每次调用 5.34×（144 分量对 12 分量）、每分量 0.44×；用平动不变性省掉 7/16 中心对后从 8.72× 压到 5.34×。据此把 2e 内核目标从 k ≥ 7.7 收到 **k ≥ 7.0**：CPHF 解析 Hessian ≈ (1 + 5.34)/k 遍次，数值 = 6N = 18 遍次，加速 ≈ 2.84k（水；苯 3N=36 在 k=1 时已 5.7×）。**仍是 blocked**：判据 20×、实测 2.12×，且 5.34× 只是原函数层的比值，AO 收缩与 MO 变换后的真实成本尚未量。下一步：CPHF 右端（一趟四元组遍历给出全部 3N 个核位移的 MO 基骨架 Fock 导数）。"
  skeleton_note: "第58轮：新增永久测试 sc02_uks_skeleton_gradient，把固定密度骨架能量（Tr(PH)+1/2Tr(PJ)+E_xc+E_nuc）做中心差分，与解析骨架（gradient_components 的非 Pulay 项 + 自旋 XC 几何导数）对照：O2/SVWN5/STO-3G 最大差 8.502e-8 Ha/Bohr（判据 1e-6）。所以骨架那一半在自旋极化下是对的，全梯度的 7.635e-3 只能来自响应（Pulay/W）；下一个可判定实验是把 W 换成不含 v_xc 的版本与全数值梯度比，见 choices 七十四。"
  r59_note: "第59轮：UKS 梯度实现在默认 SCF 分支上验证通过 —— O2/SVWN5/STO-3G 解析 vs 数值最大差 6.015e-7 Ha/Bohr（判据 1e-6，永久测试 sc02_uks_gradient_o2）。同时做了 v_xc 系数对照：W 含 v_xc 差 7.639e-3、不含 2.913e-2、双倍 4.441e-2，系数 1 最优。所以那 4% 与 W 无关，而是来自收敛辅助分支（阻尼+能级移动）：OH 在该分支上 ΔE 收敛到 9.5e-13、±δ 三点同分支且能量平滑，但解析梯度仍差 4%；OH 在默认 DIIS 分支上不收敛（400 步）—— 这条异常留给后续单独查。因此 SC-02 仍 blocked：UHF 半 done、UKS 半在 O2 上达成判据、OH 卡在该分支异常，uks+opt 尚未接线。"
  r62_note: "第62轮：OH 的 UKS SCF 扫了 11 种配方 —— DIIS（默认/阻尼0.1/0.2/能级移动0.05/0.1/0.2/初猜0.5/1.5/2.0/子空间16）全部 400 步不收敛；只有关DIIS+阻尼0.3+能级移动0.2 收敛（109步，E=-74.2499114172，<S^2>=0.75166），但残差 1.134e-2、不是驻点。所以 OH 卡在 UKS SCF 收敛路径，不是梯度实现（同一实现在 O2 上 6.033e-7）。ukes+opt 保持拒绝；解析梯度对非驻点密度报错。下一手候选：完整的阻尼退火、多重态近简并检查、UKS 的 multistart。"
  r63_note: "第63轮：给 UksOptions 加了加法字段 level_shift_decay（λ_k = λ0·decay^k，降到 1e-4 以下当 0）并试了 5 种退火配方（λ0=0.5/1.0/2.0，decay 0.85-0.92，阻尼 0.1-0.3，DIIS 开/关）—— 全部 500 步不收敛。加上第 62 轮的 11 种，共 16 种；唯一收敛的仍是关 DIIS + 阻尼 0.3 + 恒定移动 0.2（残差 1.134e-2，非驻点）。level_shift_decay 作为一般旋钮保留（默认 0 = 旧行为），但不是 OH 的解。下一步若再碰 OH：先确认是否是自旋污染近简并造成的真多稳态（例如用 UHF 的解做初猜）。"
  r64_closure: "**真正的原因找到了：UKS 的能量混用了两套密度。** 原实现用「新密度的 2e 项 + 旧密度的 XC 能量」，能量因此不是任何一套密度的泛函值，迭代映射可以没有不动点 —— OH/SVWN5 就是如此（19 种配方全不收敛）。改成**全部用更新后的密度**重算 J/K/XC 之后：OH 19 步收敛（E = −74.2502312360）、Brillouin 残差 9.18e-7；再加一条「阈值阶梯」（1e-10/1e-9 → 1e-9/1e-7 → 1e-8/1e-6）后，UKS 的解析梯度对数值梯度：**OH 5.967e-7、O2 6.246e-7 Ha/Bohr（判据 1e-6，永久测试 sc02_uks_gradient_o2）**。UHF 半此前已验（OH 3.626e-7、O2 7.285e-7），开壳层 `opt`（UHF）收敛且自旋不变（sc02_uhf_optimisation）。**验收因此达成，SC-02 记 done。** 一个如实标注的缺口：`uks` + `opt` 仍未接线（优化器内部位移几何的 SCF 会撞上迭代预算），留作后续；`uks` 的 sp 路径与 UKS 解析梯度已可用，非驻点密度会被 Brillouin 守卫生成错误而不是返回数。"
