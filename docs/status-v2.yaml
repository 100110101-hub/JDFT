  note: "**第 19 轮那个「三个数互相矛盾」的卡点定位到了**：两处都是同一个错误 —— 把虚轨道的**偏移**（0..n_vir）当成了系数矩阵的**绝对列号**。① `mo_integrals.rs` 的五处 `c(mu, a)` / `c(nu, b)` / `c(lambda, b)` 漏了 `n_occupied +`，于是 MO 变换收缩到了错误的列上（Rust 给 T1=T2=T3=4.7445，numpy 给 0.0313/0.8034/0.0313）；② `rs01_hessian_operator.rs` 把偏移传给了 `rotated_density`（实际旋转的是 i 朝一个占据列），这就是 37.96 与 80.55 的来源。修好后两个独立实现（Rust 与 numpy）在 10 个对上都一致到差分步长误差。**教训**：同一个「偏移 vs 绝对下标」的坑在一轮里出现了两次，说明这类下标应该从一开始就叫 `column_a`/`column_b` 而不是 `a`/`b` —— 现在 `mo_integrals.rs` 里就是这么写的。**遗留观察（不阻塞判据，但要记）**：H2O/def2-SVP 的 α_iso = 4.92 a.u.，约为实验值（≈9.8 a.u.）的一半。三种独立路径（CPHF、我们自己的有限场、PySCF 的有限场）互相一致到 1e-6，所以这不是实现之间的分歧，而是「这个算符/单位是否还有整体因子」的问题未定；另外 STO-3G 的 α_xx = 0.042 很小是合理的（最小基里没有 π 型虚轨道，面外响应被对称性压掉）。把 α 与实验/文献对表属于 VF-01/DA-08 的活，本轮不改判据、也不声称绝对精度。"
