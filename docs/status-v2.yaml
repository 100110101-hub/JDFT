零阻尼参数：s6 1、s8 0、rs6 1.619、alp 14，在 1.207 Å 处被压到 1e-9 量级，所以这条量的是通路不是色散量级；量级仍由 PBE/HF + D3(BJ) 那两行 −2.67e-4 / −3.39e-3 负责）。**梯度（判据的另一半）**：`qwb-engine/tests/sc06_uks_mgga_gradient.rs` 把 `opt::analytic_energy_and_gradient`（UKS 分支）与整条 SCF 的数值梯度对照 —— O2 三重态 / M06-L / STO-3G / `grid-normal` 上 **最差 |解析 − 数值| = 2.403e-7 Ha/Bohr**（判据 1e-4），非零分量恰好是两个 O 的 z 方向（±1.526647e-1，对称性把其余 10 个压到 <1e-9），墙钟 79 s。**顺手修掉一个真 bug**：`brillouin_residual`（解析梯度的驻点守卫）建 Fock 时漏了 `−α_hf·K`，于是任何 hybrid（M06-2X、PBE0…）的残差**永远**不为零、梯度恒被拒（O2/M06-2X 报 7.7e-2、OH/M06-2X 报 4.4e-2；补上 K 之后降到 1.3e-2 / 1.28e-2）。**本轮把这条收口了**：残差偏大是因为**密度阈值太松** —— OH/M06-2X 在 1e-8 上残差 5.9e-6（判据 1e-6），收到 1e-10 之后同一体系到 **1.8e-10**（123 步）。`uks_scf_with_convergence_aids` 的阈值阶梯因此加了一档 `(1e-9, 1e-10)`（排在松档之前），M06-2X 于是收敛到真驻点。判据的字面那一半现在在**同一个体系**（O2 三重态）上量到：`uks + m06-2x` 的解析梯度 = **±1.104459e-1 Ha/Bohr**（z 方向，其余 4 个分量 <1e-12），与两次 SCF 的中心差分差 **2.787e-8 Ha/Bohr**（判据 1e-4）；M06-L 那一条保留整条 12 坐标的数值对照（**2.403e-7**）。**判据两条都已过**。"
