  note: "**判据改了一处，并如实记账（记进 docs/choices.md 五十七）**：原文写「拟合误差对 H2O/def2-SVP < 1e-6 Ha（能量）」。实测（我们的实现与 PySCF **两边逐位一致**）表明这个 1e-6 把两件事混在了一起：`E_J^RI − E_J`（精确 4 中心）在 `def2-SVP`/`def2-SVP-RI` 配对下是 **6.14e-3 Ha**（占 46.845 Ha 的 0.013%），RI-J 的 **SCF 总能量**偏 **2.27e-3 Ha** —— 这是**辅助基不完备**的性质，不是实现错误；要求 < 1e-6 等于要求 76 个辅助函数把 Coulomb 能量拟合到 2e-8 的相对精度，任何实现都做不到。所以判据拆成两条：**实现正确性**用「与 PySCF 同配对的 `E_J^RI` 差 < 1e-6 Ha」（实测 1.4e-7，且三种辅助基给出同一个偏移，指向几何常数而不是积分），**辅助基质量**如实落盘（6.14e-3，并断言它落在 2e-2 的宽上界内、对照组 STO-3G 的误差 9.2e-1 远大于它）。对照组是必要的：没有它，这条断言在积分真的坏掉时也可能「通过」。"
