  note_hyperfine: "**轨道超精细实测**：水/STO-3G，O 核与 H 核各 3×7×7 = 294 个元素，与 cint 的 `int1e_prinvxp` 逐元素对照 —— 本实现 = **−**（cint 的值），O 核最大绝对差 **7.1e-11**、H 核 **3.4e-12**；同符号对照差 7.1（O(1)），所以符号关系是被钉住的而不是猜的。`M + Mᵀ` 在 O 核/H 核/非核原点分别 **2.8e-17 / 1.1e-16 / 2.2e-16**。推导：`(r_Aβ/r_A³) = −∂_β(1/r_A)` 分部积分之后，`∂_β∂_γ` 该项对 β↔γ 对称、被 ε 缩并干掉，于是只剩 `⟨∂_βμ|1/r_A|∂_γν⟩` 四项导数展开（`choices` 八十）。"
  note_angmom: "**顺磁积分的实测**：水/STO-3G、两个原点（O 核与核电荷重心）各 3×7×7 = 294 个元素，与 PySCF 的 `int1e_irp` 逐位对照，**最大绝对差 2.0e-11**（元素量级 O(1)）；`N + Nᵀ` 的三个原点（含偏心原点）**最大 1.06e-16**。基准把 `qwb-data` 的 STO-3G 指数注入 PySCF —— PySCF 内建表只有 8 位有效数字，不注入会先看到 3e-8 的假差（`choices` 七十九）。"
  note_correction: "**只做了抗磁项，且本轮订正过一次公式错误**：第一版写成 `⟨|r−R_A|²⟩`（那不是 Ramsey 抗磁算符），而「基准」脚本用的是同一个公式 —— 自洽的对照什么也没证明，1.42e-7 只验证了代数一致性。抓住它的是**自由 H 原子**：`⟨r²⟩` 版给出 ~106 ppm，而 `⟨1/r⟩` 版给出 35.50 ppm（教科书值），水 ¹H 的 840 ppm 也明显不可能（质子总屏蔽只有 ~30 ppm）。订正后数值降到几百 ppm 量级（水 ¹H 103.46 ppm，因为氧的 8 个电子都在 `1/r_H` 里有贡献）。详见 `docs/choices.md` 七十八。接下来第二步是**顺磁项**：`⟨μ|L_A/r_A³|ν⟩`（可由偶极积分对中心求导得到）+ CPHF 右端，第一条判据是**氢原子精确 1s 的 `σ_p = 0`**（`L|1s⟩ = 0`，符号与常数错都能抓住）；之后才是 GIAO/London 复数层（`length_gauge_spread < 1 ppm` 的必要条件）。**抗磁项不当化学位移用**，也不据此标 done。**第 317 轮：顺磁项做对了**。根因是**响应矩阵选错**：核磁微扰的轨道旋转是纯虚的（current 型），密度变化反对称，耦合矩阵是 `(A−B)` 而不是电场那一支的 `(A+B)`；改用 `(A−B)` 后两核的表观偏差因子从 2.28/2.92 变成**同为 2.0**，再改系数 `+2/(3c²)` 就与独立有限场参考对上（O 1.75e-4、H 2.4e-6）。顺带发现**参考自身在 λ = 0.02 有 1% 的非线性误差**（λ 扫描 0.02→0.00125 实测 O −236.76 → −239.33），参考脚本默认 λ 已改成 0.0025 并重生成。**RS-04 仍记 in_progress 的唯一原因**：最初判据是 **GIAO/London 规范不变性 < 1 ppm**，而当前是核中心共原规范 —— 实测规范误差 **O 1.50 ppm / H 7.12 ppm**（第 318 轮加入 `GaugeOrigin::Common` 后直接量出来的）。GIAO 要把基函数乘上 `exp[−(i/2c)(B×R_μ)·r]` 做复数化（等价于给 AO 积分乘相位因子、并给两个一阶算符补上各自的「随基函数中心」项），那需要复数 Fock/积分层 —— 剩下的一块就是这个，且它不在当前 unsafe/依赖政策之外（不需要新依赖，纯自研）。"
  title: "NMR GIAO 屏蔽（+ length-gauge 一致性）"
