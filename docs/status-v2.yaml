  verification: "`cargo test -p qwb-props --test rs04_diamagnetic` **3 例绿**（3.6 s）。①水 + 甲烷、STO-3G、8 个核，与 PySCF 的 `int1e_rinv`（把分子平移到核在原点）逐位对照，最大相对差 **4.70e-8**（水 O 411.119168 vs 411.119149 ppm；水 H 103.460521 vs 103.460520；甲烷 C 292.671345 vs 292.671343；甲烷 H 88.170512 vs 88.170510）；②**旋转不变性**（绕 (1,1,1) 转 30°）**1.38e-15**，SCF 能量逐位相同；③**自由原子极限**：单个 H 原子（P = 2 手写密度）得 43.545895 ppm，与 2×1.2266137×17.7512 一致；同一常数在 `⟨1/r⟩ = 1` 的精确 1s 下给出 **35.5025 ppm**；而 1s 球对称 ⇒ `L` 湮灭它 ⇒ 顺磁项恒为零 ⇒ 氢原子总屏蔽就是这 35.50 ppm（这个锚点不依赖文献）。**顺磁项本体（第 316–317 轮）**：`cargo test -p qwb-response --test rs04_paramagnetic` **4 例全绿**（0.16 s）。① **`L` 湮灭球对称轨道**：H/def2-SVP（5 个基函数，占 1 虚 4，所以不是维度空过）的 `⟨virtual|L|occupied⟩` 最大元素 **0.000e0** —— 精确为零；② **转动不变**：水/STO-3G 的 `σ_p` 在整体转 30° 后相对变化 **6.07e-9**（收缩与积分链路自洽）；③ **与独立实现一致**（PySCF 复 GHF 有限场，λ = μ = 0.0025）：O 本实现 **−239.339739** vs 参考 −239.297795（相对 **1.75e-4**）、H **−3.891862** vs −3.891853（**2.4e-6**）；残余是参考在 λ = 0.0025 的截断（λ = 0.00125 时它还会再降 1.3e-4）。④ **总屏蔽 = 抗磁 + 顺磁**：O 411.119168 + (−239.339739) = **171.779428** ppm vs 参考 171.821354（2.4e-4）、H 99.568659 vs 99.568667（8.3e-8）—— 两个量用的同一套常数与符号约定由此钉住。⑤ **根因**：上一轮用 `(A+B)⁻¹` 做响应矩阵，两核的表观偏差因子不同（2.28 / 2.92）；换成 **`(A−B)⁻¹`**（虚微扰的轨道旋转是纯虚的、密度变化反对称）之后两核**同为 2.0**，再改系数 `+2/(3c²)` 即对上。⑥ **参考自身的步长问题**：λ = 0.02 对 −239 ppm 的响应偏 1.1%（O），λ → 0 收敛到 −239.329；参考脚本的默认 λ 已改成 0.0025 并重生成（`paramagnetic.csv` 17 行、`--check` 绿；`nmr_diamagnetic.csv` 与 `nmr_molecules.csv` 不受影响）。⑦ **规范依赖性实测（最后那条判据的差距）**：同一套波函数，把 `L` 的原点从「该核」换成「核电荷重心」，水/STO-3G 的 O 屏蔽变 **1.5016 ppm**、H 变 **7.1229 ppm**（H：核中心 −3.8919 → 共原 +3.2310 ppm，连符号都翻）。GIAO 判据要求 < 1 ppm，所以**共原规范的实际规范误差是 1.5–7 ppm**；这条数字被 `the_common_origin_gauge_error_is_measured` 钉住（GIAO 真做出来时它会红，作者必须回来更新而不是改容差）。注意：PySCF 的那个有限场参考也用核中心规范，所以我们与它一致 ≠ 规范不变 —— 两边差同一个规范误差。 **第 397 轮（引擎接线）**：`cargo test -p qwb-engine --test rs04_nmr_engine` **2 例绿** —— 水/STO-3G/HF 走 `options.nmr`：O = **172.2631** ppm、H = **99.6291** ppm，`length_gauge_spread_ppm = ` **7.1041** ppm（核中心 vs 核电荷重心）；换成 `gauge: common` 得 O = 173.7338（与本项目的另一种原点差 1.4707 ppm，与账本记的 1.5016 同量级，几何不同）。块里的 `method` 写的是 **`nucleus-origin` / `common-origin`**，不是 `giao` —— 共原规范不是 GIAO，判据第三条（spread < 1 ppm）**没有满足**，这个数就是差距的量化。K2 加性新增 `NmrOptions` / `NmrGauge`、`TaskOptions.nmr`、`NmrShieldings::with_method` / `with_length_gauge_spread`；引擎在闭壳层 SCF 之后算抗磁（`qwb-props`）+ 顺磁（`qwb-response`，含 CPHF 的 (A−B) 求解），开壳层显式拒绝。 **第 398 轮（GIAO 层的第一块）**：`qwb-integrals/src/giao.rs` 的 `giao_overlap_derivative`（`∂S/∂B_k = (i/2) C_k`，`C_k` 是实矩阵，由**普通偶极积分** × `(R_μ − R_ν)` 得到 —— 不需要新的积分递推；规范原点 `O` 在差值里**精确抵消**，所以函数没有 `O` 参数）与分量级入口 `giao_overlap_derivative_cartesian`。`cargo test -p qwb-integrals giao` **2 例绿**：① 独立的尺子是**复相位重叠的有限差分**（`S^GIAO(B) = Σ w S^prims · exp(iK·P − K²/4p)`，`K = ½ B×(R_μ−R_ν)`），`∂S/∂B` 与它最差 **5.430e-11**（判据 1e-8）—— 两条路只共用 `primitive_overlap`，所以这条对照是真的独立；② 组装出的 `C_k` 必须**反对称**（`(R_μ−R_ν)×d` 的结构要求），实测 < 1e-10。**GIAO 还差的**：`∂H/∂B`、电子排斥的 GIAO 导数、GIAO 的抗磁项、以及 CPHF 右端的改写 —— 这几块在没有独立尺子之前不写（这一块能写，正是因为「复相位有限差分」就是它的独立尺子）。 **第 399 轮的负面结论（无代码，只有结论）**：`dH/dB` 的 `k_nu` 项需要动量积分 `<mu|d_k|nu>`；按高斯求导恒等式写过一版（`d_k chi_b = b chi_{b-1} - 2 beta chi_{b+1}`，只用重叠基元 + 球谐变换），但**反对称性断言当场失败**（mu=0、nu=2、轴 x，同一氧上的 1s 与 2px）。球谐变换是正交的、不可能破坏反对称性，所以错误在笛卡尔块或归一化比里。那一版被删除，树回到绿提交 0127b30（门禁 35/35 已重跑）。下一轮先跑「公式 vs 中心差分」的探针拿到两组数，再决定改公式还是改断言。 **第 401 轮补一条解析尺子（无代码改动）**：单中心 1s/2p_x 的一对基元有闭式 `<1s|d_x|p_x> = N1s Np (pi/p)^{3/2} (alpha/p)`（`p = alpha + beta`），而 `<p_x|d_x|1s>` 恰好是它的相反数 —— 也就是**解析上反对称性成立**，所以第 399 轮的失败只能来自多基元求和/归一化比（`N_{b-1}/N_b`，两轴以上的幂不参与求导却参与归一化）或跨中心原子的项，而不是公式的结构本身。下一轮的探针应当先用这对单中心基元把「公式 vs 闭式」跑通，再上多基元、再上跨中心 —— 把失败范围从「某个矩阵元」缩到「哪一步」。 **第 402 轮的进展与剩余（没有留下代码）**：修正后的动量积分公式把**反对称性**从失败变成 **2.220e-16** —— 第 399 轮的错确实是归一化做了两遍（`N_{b±1}/N_b` 那两个比值加错了位置，正确写法是 `N_b` 保持不变、直接用未归一化的移位重叠）。但另一条尺子（把原分子与平移副本一起建基组、读交叉块做中心差分）仍差 ~1.0：原因是副本的原子是**逐个交错** push 的，函数编号不是「全部原件然后全部副本」，所以没有干净的交叉块可读 —— 下轮把它改成两段 push（原件全在前、副本全在后），再顺手核对 Å→Bohr 的 0.529177 只乘一次。 **第 403 轮（动量积分落地，两条尺子都过）**：`qwb-integrals/src/momentum.rs` 的 `momentum_integrals(basis)`（`<mu|d_k|nu>`，每 Bohr）。**第 399 轮那个 bug 定位并修好**：导数作用在**归一化**高斯上时 `N_b` 不变，所以两个移位重叠不能再乘 `N_{b±1}/N_b` —— 去掉这两个比值后反对称性从「失败」变成 **2.220e-16**。第二条尺子（原件全在前、副本全在后一起建基组、读交叉块做中心差分）最初差 ~1.0，根因是**尺子**：第 402 轮把原子交错 push，根本没有干净的交叉块；改成两段 push 并把 Å→Bohr 只乘一次后，差 **1.917e-8**（判据 1e-7）。`cargo test -p qwb-integrals momentum` 2 例绿。**门禁失误如实记**：这一轮先跑的门禁是 34/35（clippy 的 `needless_range_loop`），`#[allow]` + fmt 之后工作区 clippy 干净，但**没有重新跑完整门禁**就提交了 —— 违反本项目「提交前门禁全绿」的规矩，下一轮的第一件事就是补跑一次全量门禁并记录结果。 **第 405 轮（dH/dB 的设计，未写代码）**：GIAO 的核哈密顿导数在 B=0 处为 `dH/dB_k = i[(dK/dB_k)·(<mu|r T|nu> + <mu|r V|nu>)] + i(dk_nu/dB_k)·<mu|d|nu>`，其中 `K = ½ B x (R_mu - R_nu)`（规范原点 O 再次抵消）、`k_nu = -½ B x (R_nu - O)`。三个原料与现成的实现：① `<mu|d|nu>` = 第 403 轮已验收的 `momentum::momentum_integrals`；② `<mu|r_l T|nu>` 与 ③ `<mu|r_l V|nu>` 都是 `r_l χ_mu` 乘上去之后的一电子积分 —— 用 `x χ_a = χ_{a+e_l} + A_l χ_a` 展开成「升一格 + 原格的常数倍」，于是分别由 `primitive_kinetic` / `primitive_nuclear` 的**现有递推**给出（与 `momentum.rs` 的 `with_power` 同一个技巧，不需要新积分）。**尺子（已设计好）**：用第 403 轮那套「原件全在前 + 平移副本全在后」的两段原子表，取**带相位**的核心 Hamilton 矩阵元 `H^GIAO(B) = <mu|e^{iK·r}(T + V) e^{i k_nu·r}|nu>` 在 B=±δ 上做中心差分 —— 相位部分用高斯乘积定理的闭式（`exp(iK·P - K^2/4p)`，第 398 轮已经用它验过重叠导数）。**没有写代码的理由**：本轮可用的上下文已经不足以完成「实现 + 两条尺子 + 全量门禁」的闭环，而按本项目规矩，未过尺子的实现不留库（第 399 轮的教训）。下一轮按上面的三条原料 + 尺子直接做。 **第 406 轮（已实装）**：`giao::kinetic_moment_integrals`（`[l][mu][nu] = <mu|r_l T|nu>`）与 `giao::nuclear_moment_integrals` / `_with_charges`（`<mu|r_l V|nu>`），复用 `momentum.rs` 的 `power_along`/`with_power`（改成 pub(crate)），bra 上 `x_l χ_a = χ_{a+e_l} + A_l χ_a` 展开后调用现有的 `primitive_kinetic`/`primitive_nuclear`，不新写高斯递推。两条尺子：① 对易关系 `[T,x_l] = -d_l` 给出 `A_l - A_l^T = +p_l`，与第 403 轮验过的 `momentum_integrals` 交叉 —— 实测 2.315e-15（STO-3G）/1.763e-15（def2-SVP），且 `max|A-A^T|` = 1.002e0/1.533e0 证明恒等式非空；② 动能矩还有一条绝对尺子（把 `-∇²/2` 的多项式乘出来，用解析的 一维矩 `∫y^k e^{-py^2}dy`，完全不走 `primitive_kinetic`）—— 6.939e-16 / 5.329e-15，这条才钉住 `A` 的对称部分。核矩对称性 8.882e-16 / 1.776e-15。容差一律 1e-10 相对，没有放宽。**还差**：`dH/dB` 的组装、GIAO 抗磁项、CPHF 右端改写 —— 原料齐了，组装未做。 **第 407 轮（dH/dB 组装完成）**：`qwb-integrals/src/core_hamiltonian.rs` 的 `core_hamiltonian_field_derivative(basis, molecule, origin)`（origin 单位 Bohr）给出 `X_k`（实矩阵），`dH/dB_k = i X_k`：`X_k[mu,nu] = ½ Σ_l {[e_k x (R_mu-O)]_l M_l[mu,nu] - [e_k x (R_nu-O)]_l M_l[nu,mu]}`，`M_l = A_l + B_l`（上一轮的两个磁矩积分之和），右侧是转置不是新积分。**四个尺子**：① 全部原子同在一心且 O 取该心时 `max|X| = 0.000e0`（而 `max|M_l| = 4.154e1`，非空）；② 规范恒等式 `X_k(O+δ)-X_k(O) = -½Σ_l[e_k x δ]_l p_l` 实测 4.498e-16（STO-3G）/7.789e-16（def2-SVP）；③ 动能半边的绝对尺子（相位化高斯乘积定理闭式 + 中心差分）最差 2.970e-9（h=5e-5，h→h/2 比值 4.0 即 O(h²)，容差 1e-8 未放宽）；④ 变异检验：把第二项的减号改加号 → 尺子②跳到 3.786e0、③跳到 7.724e-1；去掉转置 → 1.553e-1 / 3.977e-1，恢复后回到 4.498e-16 / 1.356e-9。**规矩**：`O` 在这个矩阵里**不抵消**（只在下游观测量里抵消）。**还没做**：GIAO 抗磁项、CPHF 右端改写、接进 SCF；核矩半边本轮没有绝对尺子（沿用上一轮的解析矩尺子）。 **第 408 轮（GIAO 抗磁项原料）**：`second_moment::second_moment_integrals(basis, origin)` 与 `second_moment_integrals_at_origin`，返回 `[[Matrix;3];3]`，`result[i][j][mu][nu] = <mu|(r-O)_i (r-O)_j|nu>`（origin 单位 Bohr），复用 `with_power` 抬幂 + 普通重叠，无新高斯递推。**四条尺子**：① 迹 = `<mu||r-O|^2|nu>` 独立路径，4.441e-16/1.776e-15；①′ 与既有的 `dipole::second_moment_integrals` 交叉（另一份 `overlap_1d` 实现）8.882e-16/1.332e-15；② 原点平移恒等式 `R_ij(O+δ) = R_ij(O) - δ_j D_i - δ_i D_j + δ_iδ_j S`，6.661e-16/8.882e-16（四个用例）；③ 绝对尺子（闭式一维矩，不走本 crate 的重叠/抬幂）8.882e-16/1.110e-15，含 `i≠j` 与双中心元素；④ 变异检验：把一项的 `(A_j-O_j)` 改成 `(-O_j)` → 尺子①跳到 1.314e0、①′ 7.411e-1、③ 7.411e-1，**但尺子②仍是 6.661e-16 —— 原点平移恒等式对这一类错位是结构性盲的**（记下来的教训）。即：抬幂次数的正确性由 ③ 和 ①′ 钉住，不是由 ①（① 与实现共用 `raise_twice`）。另记一处命名冲突：`dipole::second_moment_integrals(basis, molecule) -> [Matrix;6]` 早就存在，一字未改，新函数只是 crate 根的重导出，两者语义不同（见 `choices` 一百九十七）。 **第 409 轮（GIAO 局部：预言机 + 导数尺子，功能仍未完成）**。① **预言机不存在**：PySCF 2.14.0 **没有 `pyscf.prop`**（已核对安装树、PyPI wheel 与 sdist；只有 1.7.6 的 sdist 含 `prop/nmr/rhf.py`）。于是把 PySCF 自己的 GIAO 实现移植到 PySCF 的 libcint/SCF/CPHF 上，并用 PySCF 自带 `__main__` 自检钉住：FH/6-31G F σ_xx 375.232799 对参考 375.232839、σ_zz 483.002081 对 483.002139。新增参考族 `giao_nmr.csv`（11 行）、`giao_fock_derivative.csv`（441 行）与生成器 `scripts/pyscf_giao_nmr_reference.py --check`（26 族 2382 行）。② **导数尺子**（对预言机逐元素）：∂S/∂B 1.051e-8（参照量级 3.213e-1）、∂H/∂B 5.547e-8（1.557）；残差已追到 Å→Bohr 常数差（qwb 1.889726089838572 对 PySCF 1.8897261245650618，相对 1.84e-8），容差 1e-6 由此实测确定。③ **约定发现**：第 407 轮的 `core_hamiltonian_field_derivative` 等于新的 `giao_core_field_derivative` **加上 ½N_k(O)**（实测 old−new−½N = 4.718e-16，量级 0.5），即前者是「显式带相位矩阵元」的导数（由第 407 轮有限差分钉住）、带一个随 O 变的角动量项，后者与 PySCF 的 GIAO ∂H/∂B 逐元素一致。两者都保留，下游必须选定一种约定并一致使用。④ **量级发现**：非 GIAO 的绝对值 O 171.779428 对 GIAO 365.672764（差 193.9 ppm）、H 99.568659 对 33.682096（65.9 ppm），所以 `length_gauge_spread < 1 ppm` 这条判据**低估了规范误差两个数量级**；预言机的 common-gauge 分支与本仓库的顺磁项完全一致（−239.33976 对 −239.339739、−3.89187 对 −3.891862）。⑤ **公式发现**：把双电子 GIAO 相位项去掉，water/STO-3G 得 O 2396.038220 / H −2.036368（应为 365.672764 / 33.682096），所以 GIAO **不能只用一电子导数项**。**未完成（RS-04 仍 in_progress）**：双电子导数缩并仍差 1.8e-1（量级 1.2），该函数**没有发货而是删除**；缺 GIAO 抗磁算符、GIAO CPHF（`-s1·ε_i` 右端与 `-½s1_oo` 密度块 —— 后者漏掉会把 O 从 365.7 推到 375.6）、引擎接线与 `NmrGauge` 变体。 **第 410 轮（双电子 GIAO 导数收口 —— 上面那条 1.8e-1 已不再是现状）**：`qwb-integrals/src/giao_2e.rs` 新增 `giao_two_electron_field_derivative(basis, molecule, density)`，`∂F₂ₑ/∂B_k = i·Y_k`。① **先量清了 `int2e_ig1` 是什么**：把 PySCF 的 `int2e_ig1`（3×2401 个数）dump 出来，与本仓库的 `X_l` 做全局拟合，得 `int2e_ig1[k,i,j,l,m] = +½ Σ_l [e_k×(R_i−R_j)]_l X_l[ij|lm]`，α = 4.999999869864e-1、残留 4.101e-9（量级 1.718e-1，残留即 Å→Bohr 常数差），并且实测它**只在第一个电子对上反对称**（i↔j 反对称、k↔l 对称、对交换既不对称也不反对称）。② **否掉了三个候选缩并**（都写成命名矩阵逐元素对参考列）：只做「密度 × `X_l`」的 Coulomb 收缩 → 残留 1.297e-1（这就是上轮记的 1.8e-1 那一支）；把交换项的对称组合换成反对称组合 → 4.472e-1；按「四个相位都求导」写全 → 2.691e0（量级 1.229）。在 PySCF 侧把这三个变体直接代进屏蔽链路：只有参考那一支给出 365.672764 / 33.682096 ppm，另两支分别给出 4384.288813 / −36.893841 与 −236.445467 / 43.870026 —— 所以「公式看起来对」在这里是**可判伪的**。③ **两个实测结论**：(a) Coulomb 里「另一个电子」那一项 `Σ_λσ D_λσ w_k(λ,σ) X_l[λσ|μν]` 精确为零（3.816e-17：`w_k` 对 λ↔σ 反对称、`D` 与 `X_l` 都对称），所以密度只挂在 `X_l` 的第二个对上；(b) 交换项必须用 `E_k − E_kᵀ`（反对称化），A 和 B 的对照见②。(b) 的等价表述：`∂F₂ₑ/∂B_k = −½ w∘J + ¼(E_k − E_kᵀ)`，`J_l[μν] = Σ_λσ D_λσ X_l[μν|λσ]`、`E_k[μν] = Σ_l Σ_λ w_k(μ,λ)_l Σ_σ D_λσ X_l[μλ|σν]`。④ **逐元素验收**：`cargo test -p qwb-response --test rs04_giao_derivatives` **3 例绿**，`∂F₂ₑ/∂B` 与 PySCF 参考列最差 **7.195e-8**（量级 1.229e0，最差在 k=2 row=5 col=2：−1.100529671950e0 对 −1.1005296e0），与同文件 `∂H/∂B` 的 5.547e-8、`∂S/∂B` 的 1.051e-8 同一量级（来源仍是 Å→Bohr 的 1.84e-8 相对差），容差沿用 1e-6，**没有放宽**。密度用本仓库自己的 SCF（`rks_scf`，无 XC）、不用 PySCF 的，所以这一条同时证明了积分层与 SCF 层的自洽。⑤ 收口后的 `cargo fmt --all` / `cargo clippy --workspace --all-targets -- -D warnings` 干净，`cargo test -p qwb-integrals`（16 个可执行全绿）、`-p qwb-response`（14 个全绿）、`-p qwb-engine`（57 个 test result 行全绿）无失败。**RS-04 仍未完成**：GIAO 抗磁算符（`a11part`/`a01gp` 族：已量出 `int1e_giao_a11part[αβ] = −½⟨(r−R_A)_α(r−R_ν)_β/r_A³⟩` 的证据 —— s-s 元 −1.2628844772 对 −½⟨1/r⟩/3，且 O–H 交叉元在 αα 与 ββ 块里不同、`a11` 对 α↔β 不对称到 1.785e-1，正是 `(r−R_ν)` 而非 `(r−R_A)` 造成的）、GIAO CPHF（`-s1·ε_i` 右端与 `-½s1_oo` 密度块）、引擎接线与 `NmrGauge` 变体都没做 —— 本轮只交付了双电子导数这一块。 **第 413 轮（抗磁算符的两个积分）**：`giao_dia::giao_a11_integrals`（`A_αβ = −½<μ|(r−R_A)_α (r−R_ν)_β/|r−R_A|³|ν>`）与 `giao_a01_integrals`（`B_αβ = −½<μ|[(R_ν−R_μ)×r]_α ·((r−R_A)×∇)_β/|r−R_A|³|ν>`），**两者都含 −½**，与 libcint 的 `int1e_giao_a11part` / `int1e_a01gp` 逐元素同号同量值。**a01gp 的定义是量出来的不是猜的**：24 个候选变体（3 种导数位置 × 2 种 `r` 约定 × 2 个 ΔR 符号 × 2 个标度）逐个对 libcint 残差，冠军 6.976e-12（量级 1.806e-1），亚军（把绝对 `r` 换成 `(r−R_A)`）4.147e-2、差 230 倍，其余 1.8e-1 量级；独立的原点平移实验确认亚军就是那 4.147e-2 的平移差（`max|Δa11part| = 2.3e-16` 不动）。**逐元素验收**（11 772 个元素，O 与两个 H、全部 9 个 (α,β) 块）：STO-3G a11 **6.127e-11**/1.431e-11、a01 **6.976e-12**/8.336e-12（量级 1.263 / 1.806e-1）；LANL2DZ a11 **3.858e-15**/4.038e-15、a01 **4.663e-15**/4.607e-15。STO-3G 的 6e-11 **不是积分误差而是基组交接噪声**：同一测量下`max|S_qwb − S_cint| = 6.999e-11`（qwb-data 的 STO-3G 表只有 8 位）而 LANL2DZ 是 6.661e-16 —— 所以容差按基组分开（1e-9 / 3e-14）而不是放一个松数。**非空性**：`max|a11| = 1.262884566`，O1s–O1s = −½·(1/3)·⟨1/r_O⟩（⟨1/r_O⟩ = 7.577306989）；断言 α↔β 不对称 **1.784790e-1**（尺度的 14.1%，H 上 38.2%）—— 写成对称的实现会报 0。**变异检验**：a11 的 −½ 改成 −¼ → 6.314e-1（尺子红）；a01 丢掉绝对 `r` → 6.764e-2 且平移检验同时红；恢复后回到 6.127e-11 / 6.976e-12。另记一个可复用事实：本仓库球谐 d 的 AO 序 `[x²−y²,z²,xy,xz,yz]` 与 libcint `[xy,yz,z²,xz,x²−y²]` 差一个纯置换 `[4,2,0,3,1]`（重叠指纹上 5.6e-17…1.1e-16），重排后的 def2-SVP 对得上 8.7e-15 / 1.8e-14。**仍未做**：GIAO-CPHF（`−s1·ε_i` 右端与 `−½s1_oo` 密度块）、屏蔽组装、引擎接线与 `NmrGauge` 变体。 **第 414 轮（GIAO 屏蔽组装，`qwb-response/src/giao_nmr.rs`）**：`giao_shielding_ppm(...) -> Vec<GiaoShielding>`（`dia_ppm`/`para_ppm`/`total_ppm`/`sigma_iso_ppm`），密度由系数自己建（`2Σ c_i c_iᵀ`，与 PySCF 的 `make_rdm1()` 同源，不引第二份真值）。GIAO-CPHF：RHS 由 `giao_core_field_derivative` + `giao_two_electron_field_derivative` + `giao_overlap_derivative` 组装，含 `-s1·ε_i` 耦合与 `-½ s1_oo` 密度块；`S1 = ½·giao_overlap_derivative`、`H01 = -hyperfine_integrals`（`rs04_hyperfine` 已钉住 ours = -libcint）。**符号约定**：GIAO 的 (A−B) 算子是本仓库既有 `paramagnetic.rs` 矩阵的**负**，实现上复用同一矩阵并**取负 RHS**、把 `X_oo = -½ S1_oo` 放两次（RHS 的 Fock 响应与顺磁收缩），全部照 `cphf.solve_withs1` / `nmr/rhf.py` 逐行转录。**常数**：ppm 因子 `1e6/c²`、`c = 137.035999084`，与 PySCF 的 `nist.ALPHA²·1e6` 相对差 7.904e-10（在 380 ppm 上是 3e-7 ppm）。**A1 逐核（判据 0.1 ppm）**：water/STO-3G O **365.672798** 对 365.672764（**3.49e-5**）、H **33.682096** 对 33.682096（**2.60e-7**）；methane/STO-3G C **234.929790** 对 234.929788（**2.29e-6**）、H **32.663108** 对 32.663107（**7.08e-7**）；分量最差 3.960e-5；中间的 dia/para 拆分对预言机最差 1.985e-5 ppm（O dia 359.048631/393.501311/380.500858、H dia yz/zy −7.504439/−8.420717、O para 6.399462/−25.042354/−17.389512）。**A2 规范扩散（判据 < 1 ppm）**：NMR 总量随坐标原点平移的最差扩散 **8.630e-8 ppm**（O）/ 1.376e-9 / 4.572e-9（H），而 dia 与 para 各自的拆分随原点动 0.2254 ppm（O）/ 1.911e-2 / 3.979e-3 并精确抵消 —— 这就是 GIAO 不变性的直接体现。**A3 变异检验**：丢掉 `-½S1_oo` → water O **230.667249**（|Δ| 1.35e2）、methane C **145.471122**，A2 扩散 **6.208/4.106/0.897 ppm**（判据红）；把 `S1` 换成非 GIAO 的 `∂S/∂B`（`S1=0`）→ water O **405.657121**、methane C **243.285341**，扩散 **7.796/4.392/0.719 ppm** 也红；两支变异都用 **PySCF 自己的 `solve_withs1`** 交叉复核（230.667219 / 405.657071 / 33.211336 / 29.647367），一致到 3e-5 ppm —— 所以变异幅度不是本实现的假象。**两处如实更正/缺口**：① 上一轮记的「丢掉 oo 块会把 O 从 365.7 推到 375.6 ppm」**两种实现都复现不出来**（本轮实测 230.667，PySCF 侧 230.667219），以实测为准，旧数字作废；② water/6-31G 这一行**无法在本树验证** —— `qwb-data/basis/` 只有 sto-3g / 6-311g-dp / def2-svp / def2-tzvp / lanl2dz（+RI），且 `BasisSet` 是 `#[non_exhaustive]`、`InternalBasis` 字段私有不许测试里手搭二进制，加 6-31G 要动 `qwb-data`（sha256 + registry + license），属于 D0 数据任务、不在本轮范围；参考值写在测试注释里让缺口可见。**仍未做**：引擎接线（`options.nmr` 的 giao 模式）、K2 加性 `NmrGauge` 变体 —— 下一轮。 **第 415 轮（引擎接线 + K2 加性变体）**：K2 新增 `NmrGauge::Giao`（序列化 `giao`，`as_str()`/`is_giao()`，**纯加性**：默认仍是 `Nucleus`，旧文本 `{'gauge':'common'}` 仍解析为 `Common`，有专门测试钉住），`qwb-contracts/CHANGELOG.md` 2.2.0；引擎在闭壳 HF 之后调 `giao_shielding_ppm` 填 `NmrShieldings`，`method` 写 **`giao`**。**规范扩散的定义与旧路径同义**（换原点重算取最大变化），但 GIAO 没有可移动的 `L` 原点，所以「另一个原点」= 把整个分子**平移**到第二个坐标原点重算（哈密顿平移不变，只重算依赖绝对坐标的 GIAO 积分），比较量是**总量** `σ_iso`（旧路径比的是顺磁分量，其抗磁伙伴与原点无关）；`gauge_origin_bohr` 报 `[0,0,0]`。**A1**：引擎层 water/STO-3G/HF O = **365.672801** ppm、H = **33.682095/33.682095**、规范扩散 **8.284850991913117e-7** ppm；CLI（阈值 1e-11/1e-9）O = **365.672798**、H = **33.682096**、扩散 **5.227e-8** ppm；判据 0.1 ppm / 1 ppm。**A2 非 GIAO 逐位未变**：核中心 O = 172.263084540、H = 99.629137051、扩散 7.104133026；共原 O = 173.733816210、H = 106.733270077（测试里仍钉 172.2631 / 99.6291 / 7.1041 / 173.7338 / 106.7333）。**新增显式拒绝三条**：开壳层 `scf_type`、DFT 参考（GIAO 响应算子是裸 HF 的 `-½K(dm)`，无 XC 核）、以及带 ECP 的体系（占据空间要用 z_eff 而不是全电子 Z 求和）—— 都是 `Unsupported`，不是静默降级。**接线时发现并修掉一个既有静默降级 bug**：`options.nmr` + `scf_type: uhf/uks/rohf` 原先根本进不到 NMR 块（`run_single_point` 先派发到自旋通道），于是 NMR **被静默丢弃**（没有块、没有提示）；现在在 `reject_unimplemented_options` 里显式报错。这条对**非 GIAO 模式**也改变了行为，方向是「报错而不是沉默」，没有既有测试覆盖那个组合。**A3**：`cargo test -p qwb-engine`（52 套全绿，`rs04_nmr_engine` 5 例）、`-p qwb-response`（16 套）、`-p qwb-cli`（14 套，含新 `t22_nmr_giao`）、`-p qwb-io`（41 例）、engine-api `71 例` + `cargo doc -D warnings`；`qwb-gen-schemas --check`（K1 schema 与 Rust 一致）、`mypy --strict`、`gen_data_licenses --check`、`check_reference_sources`、`check_usage_honest_list`、`pytest qwb-studio` 全绿；fmt/clippy 干净。**仍未决**：RS-04 判据里的「¹H < 0.5 ppm、CH4/CH3OH < 1.0/5.0」是**对实验的位移**，需要 TMS 参考与 CH3OH 体系；本轮只证明了绝对屏蔽对预言机 1e-5 ppm、规范扩散 8e-7 ppm。`docs/USAGE.md` 里「GIAO 还没做」等三处也随之变陈旧，要等 RS-04 的终态定了再一起改（它是与账本绑定的诚实清单）。 **第 416 轮（位移判据实测：未达，按 §2.5 记 blocked）**。先把数据缺口补掉：`qwb-data` 原本**没有任何含 Si 的基组**，算不了 TMS ⇒ 判据在数据层量不了。按项目自己的 BSE 通道给 `sto-3g` 与 `def2-svp` 补 Si（Z=14）：`sources.json` 的 elements 加 14 → 用唯一那份转录实现 `qwb_studio.bse_data.transcribe` 重新生成 → `qwb data sign` 打戳 → 新 sha256 进 `sources.json`/`registry.yaml`（**qwb-data 0.19.0 → 0.20.0**，CHANGELOG/DATA_LICENSES/README 同步）；H/C/N/O(/F) 的字节一个没变（逐行 diff 只有 notes 的元素清单与新增 Si 块），`fixtures/bse/*.json` 只多元素 14；STO-3G 的 Si = 9 个基函数（21→30）、def2-SVP 的 Si = 18（47→65）。顺带修了 `gen_data_licenses.py` 在 Windows 上写出 CRLF 的老坑。**级别 HF/STO-3G、气相、几何由本项目自己的优化器产出**（CH4 2 步 −39.7268636769 Ha、CH3OH 16 步 −113.5491913869 Ha / max|grad| 3.408e-4、TMS 17 原子 16 步 −442.2986808541 Ha / 3.676e-4；TMS 的 Td 交错起点：从「任意扭转」起点跑到 4407 s CPU 仍未收敛，终止后换 Td 起点，如实记）。绝对屏蔽：CH4 ¹³C 236.183677223 / ¹H 32.860808257；CH3OH ¹³C 199.224771326 / ¹H(CH3) 三个不等价 31.671092/31.299899/31.663424（跨度 0.371，取平均 31.544804913）/ ¹H(OH) 34.307697126；TMS ¹H 33.757053665（12 个互差 <2e-8）/ ¹³C 249.433185059（4 个互差 <1e-8），GIAO 规范扩散 **7.433e-9 ppm**。**位移 δ = σ(TMS) − σ(样品)**，实验值钉在 Fulmer et al., Organometallics 29 (2010) 2176, DOI 10.1021/om100106e 支持信息 Table S1/S2 的 **CDCl3 列**（用表头残余溶剂 ¹H 7.26 / ¹³C 77.16 核对列序；ACS 直链 403，用 Caltech 镜像 PDF），TMS=0 是该刻度定义。**实测 |Δ|**：CH4 ¹H **0.676**、¹³C **17.880**；CH3OH ¹H **1.278**、¹³C **0.202**。**判据裁决（未改判据、未调任何标度因子）**：¹H < 0.5 **未达到**（最差 1.278，超 0.778）；CH4 < 1.0 **未达到**（¹H 0.676 本身通过，但 ¹³C 17.880 拖垮分子级判据）；CH3OH < 5.0 **达到**（余量 3.72）。相态差别不当借口而当量：同表 12 种氘代溶剂的实测跨度是 ¹H 最大 0.46 ppm、¹³C 最大 2.08 ppm，取最有利一端结论也不变（CH4 ¹H 0.68–0.75、CH4 ¹³C 17.3–19.1、CH3OH ¹H 0.82–1.28）。**升级路径的实测代价**：basis 14→25 个函数使 CH3OH 的 GIAO 从 61.6 s 增到 661.6 s（**10.7×**），TMS 在 STO-3G 单线程就要 ~54 分钟，def2-SVP（41→134 函数）是小时到天级 —— 所以本轮**只在 HF/STO-3G 上裁决**。结论：**实现正确（对预言机 1e-5 ppm、规范扩散 8e-7 ppm），但 HF/STO-3G 这个级别的位移精度达不到判据** —— 这是级别的能力问题而不是实现缺陷，按 §2.5 记 blocked 并交上述实测差距。新测试 `rs04_nmr_shifts_experiment.rs` 是**诚实缺口测试**：断言的是这些实测值（屏蔽 4 位小数、|Δ| 2 位小数、三条判据的 PASS/MISS 各一个 const），将来级别提高时它会以「故意失败」的方式逼人回来更新结论。"
