# 规范：[`../project-phase2.md`](../project-phase2.md)（§6 WBS、§7 里程碑、§10.6 记账）。
# 阶段一的账本 `status.yaml` 只读作基线，**不再追加**（project-phase2.md §13 #35）。
#
# 状态取值：done / in_progress / blocked / pending（`scripts/check_status.py` 强制）
# 记账格式：
#   KP-01:
#     state: done
#     ts: "2026-11-06T12:00:00Z"
#     artifact: "..."
#     verification: "命令 + 实测数字"
#
# 校验：python scripts/check_status.py docs/status-v2.yaml
#
# 约定：`stretch` 项允许以 blocked 收口，但 reason 里必须有实测数字与 gap（§2.5）。

