ants`/`eeq`/`frequency_grid`/`unsupported_functionals` 四块（`qwb-stamp-data` 实测报 `unknown field constants`），所以按「契约先落」的顺序，下一步是给 `qwb-registry` 加 D4 的类型并重新生成 schema，再从 staging 移到 `qwb-data/dispersion/d4.yaml` 并加 `registry.yaml` 条目 + `DATA_LICENSES`（现在仍是 32 个文件，加进去会变 33）。`aatoau` 不是手写的：生成器复用 `validate_d4_data.py` 里那份 CODATA-2018 推导（`mctc_aatoau()`），并断言它等于 1.8897261257783122。 **D4 的契约落地（本轮）**：`qwb-registry` 新增 `d4` 模块与独立类型 `D4Dispersion`（`kind: d4`：`constants`/`eeq`/`coordination_number`/`frequency_grid`/`reference` + `damping_parameters` + `unsupported_functionals` + `dispersion.atm` + `provenance`），结构校验 `check_structure` 覆盖：元素按 Z 升序、四个 EEQ 数组长度 = 元素数、每个参考体系的 `alpha(iω)` 点数 = 频率网格点数、`r4r2`/`zeff`/`rad` 为正、频率网格严格升序、`damping_parameters` 非空、`provenance` 的 sha256 形如 64 位十六进制；并把**上游事实**写进校验：`dispersion.atm.charge_for_c6` 必须为 0（ATM 用 q = 0 重建 C6，用分子电荷会偏最多 30%）。K1 的这一支是**加性扩展**：`DataKind::ALL` 9 → 10、新 schema `d4dispersion.schema.{json,yaml}`、`registry.yaml` 新增 `d4_dispersions` section、**D3 的类型与文件一个字都没动**（`get_dispersion` 仍只返回 D3，`get_d4_dispersion` 只返回 D4，测试 `d4_data_is_a_separate_kind_from_d3` 钉住两条访问器不串）。数据文件已从 staging 移到 `qwb-data/dispersion/d4.yaml`、`qwb-stamp-data` 打戳 `150676400ae138f58900fa989ffdfd6c73c897bbb0693dc4e42aaea417d739b3`、`registry.yaml` 0.14.0 → **0.15.0**、`DATA_LICENSES.md` 32 → **33 个文件**；`qwb data verify` **33/33** 通过（其中 `d4dispersion ../qwb-data/dispersion/d4.yaml` 0 error 0 warning）；新测试 `qwb-registry/tests/da06_d4_data.rs`（2 例）复核加载路径与数量（36 元素 / **119 个参考体系** / 5 个泛函 + m06-2x 记为缺失），并复核派生量 `r4r2 = sqrt(0.5·<r⁴>/<r²>·sqrt(Z))` 自洽（< 1e-12）。**踩到两个顺序/互操作的坑**：①`infer_kind` 必须先看**文件名**再看目录名，否则 `dispersion/d4.yaml` 会按 D3 类型解析（报一堆 `unknown field constants`）；②`qwb-stamp-data` 用 serde_yaml 重新序列化后把小量级浮点写成 `1e-6`，而 YAML 1.1（PyYAML）把 `1e-6` 读成**字符串** —— 所以生成器的 `--check` 按数值比较（值仍须逐位相等）。 **D4 的中间量层落地并逐层对上官方（本轮）**：`qwb-scf/src/d4.rs` 实现 `properties()` —— ①电负性加权的误差函数 CN（`½(1+erf(−kcn(R−rc)/rc))`，`rc = 4/3·(rcov_2009,i+rcov_2009,j)×aatoau`，`kcn = 7.5`）；②EEQ(2019) 电荷（`A_ii = η+√(2/π)/rad`、`A_ij = erf(r/√(rad_i²+rad_j²))/r`、拉格朗日行/列实现 Σq = Q，部分主元高斯消元）；③参考权重（`ngw = icn(icn+1)/2` 的高斯 × `ζ(ga, η_i·gc, q_ref+zeff, q+zeff)`）；④C6（对每个参考体系对做 `3/π·trapzd` 的 `Σ_k w_k α_i(ref,k) α_j(ref,k)`，再按权重加权）。对照 `tests/reference/d4_properties.csv`（官方 dftd4 4.3.1 的 `get_properties()`，9 个二聚体）：**CN 2.823e-9、EEQ 电荷 1.037e-10、C6 2.272e-9 Ha·Bohr⁶、Σq = 9.7e-17**（判据 1e-7 / 1e-8 / 1e-7）。**一个把精度卡住的真问题**：第一版 `erf` 用 Abramowitz & Stegun 7.1.26（`|ε| ≤ 1.5e-7`），实测 CN 差 2.3e-7、C6 差 1.8e-5 —— 因为 CN 进参考权重是 `exp(−igw·wf·(CN−CN_ref)²)`（`wf = 6`），1e-7 的 erf 误差会被放大；换成全正项幂级数后（`|x| ≤ 6` 到 1e-14）三个量一起降到 1e-9/1e-10。另一条测试 `d4_charges_respond_to_the_total_charge` 钉住「电荷相关」这件事本身：同一几何 q = 0 / ±1 时 Σq 精确到 1e-9、电荷与 C6 都跟着变（不是把电荷当装饰）。**仍未做**：两体能量/梯度与 ATM。 **D4 的能量层：两体项已验证，ATM 还差一个整体因子（本轮）**：`qwb-scf/src/d4.rs` 增加了 `dispersion_energy()`（两体项 `−Σ_{i<j} C6_ij[s6/(R⁶+r0⁶) + s8·rrij/(R⁸+r0⁸)]`，`rrij = 3·r4r2_i·r4r2_j`、`r0 = a1√rrij+a2`；ATM `−Σ_{i<j<k} ang·fdmp·C9`，`alp/3` 阻尼，C6 用 **q = 0** 重建）与 `D4Result`（总/两体/ATM 三项分开报告，诊断时不至于只看到一个总数）。对照 `d4_dispersion.csv`（官方 `get_dispersion()`，60 行）：**两体项对得上** —— `m06-l`（`s8 = 0`）的行差 ≤ **7.1e-7** Ha；**ATM 还差一个整体因子** —— 误差 / ATM 在各泛函上是**同一个常数 2.4**（b3lyp 2.33e-7/9.61e-8、pbe 1.44e-7/6.04e-8、pbe0 7.15e-8/3.01e-8、hf 4.04e-6/1.70e-6、m06-l 4.18e-10/1.64e-10），且**与总电荷无关**（q = 0/±1 三行完全相同），所以问题在 `ang·fdmp·C9` 的装配（上游 `damping/atm.f90` 里 `dE` 到 `E` 的因子），不在电荷权重。测试 `da06_d4_energy.rs` 因此只对 `m06-l` 的行设判据（2e-6，含残余 ATM），ATM 那半边**不设通过断言、也不放宽容差**，只打印 —— 不留「把错的东西测绿」的口子。`gradient_max_abs` 一列这一轮同样不对照（能量对 ≠ 梯度对），`D4Result` 也故意先不暴露梯度。 **D4 的能量层已对上官方（本轮收口）**：最差 |ΔE| = **6.435e-13 Ha**（60 行，含 q = 0/±1；m06-l 单独 4.8e-13，判据 1e-9），即两体项 + ATM 都比 D3 的 1e-3 kcal/mol 判据严 7 个数量级。**根因是语义而不是公式**：ATM 的 C6 要按**每个原子的部分电荷 = 0** 重建（上游 `disp.f90:139-141`），而我先前把它实现成「把体系总电荷设成 0 再解一遍 EEQ」—— 后者仍然给出 ±0.6 的原子分电荷，于是水二聚体的 ATM 是 −9.6076e-8 而不是 −3.2866e-7，差 **3.42 倍**；这正是上一轮记录的「误差 / ATM ≡ 常数 2.4」的真身（2.42 = 3.42 − 1）。定位办法不是再读代码，而是拿官方绑定做**s9 开关实验**（同一 s6/s8/a1/a2，`s9 = 1` 与 `s9 = 0` 各算一次），把参考能量劈成两体与 ATM 两半，再用 numpy 原型分别按「分子分电荷」与「分电荷为零」两种 C6 去对 —— 后者与官方**逐位**相同（−3.286570e-7 vs −3.286570e-7），于是问题从「公式差一个因子」变成「参数含义读错」（`docs/choices.md` 一百五十七、一百五十八）。 **D4 梯度第一段（三个链式法则的导数）已落地并验到 1e-12 量级（本轮）**：`qwb-scf/src/d4.rs` 新增 `cn_gradient`（∂CN_i/∂R_a，误差函数计数函数的解析导数）、`charge_gradient`（∂q/∂R：`A·dq = db − (∂A)q`，每个笛卡尔坐标解一次，拉格朗日约束的末位 RHS 为 0）、`c6_gradient`（∂C6/∂R 只经参考权重：`∂g_r/∂CN`、`∂ζ/∂q` 解析，`alpha(iω)` 与电荷/CN 无关）与 `reference_weights` 的公开化。验证办法不是「FD 差小于 1e-8」，而是 **Richardson 外推** 把差分截断误差与导数误差分开：raw h = 1e-3 时水二聚体 |ΔCN| = 5.436e-7（这是 O(h²) 截断，不是导数错），外推后 **|ΔCN| = 3.223e-12、|Δq| = 6.813e-12（两个二聚体的最差值）、|ΔC6| = 1.922e-10**；平移不变性 Σ_a ∂CN_i/∂R_a = **2.634e-18**、Σ_a ∂q_i/∂R_a = **2.255e-17**。也就是说导数本身到了机器精度量级，剩下的 ~1e-10（C6）来自 FD 参考本身的舍入。`dispersion_energy` 的行为没有变（**6.435e-13 Ha** 复测相同）。**仍未做**：把这三个导数与两体/ATM 的几何导数装配成 `dispersion_gradient`，再对官方 `gradient_max_abs` 列。 **判据第 ② 条「对每个元素对都有测试」已补上（本轮）**：D3 那半的元素对是数据表里的 666 个 `C6` 键、可以逐个 diff；D4 的 C6 **不是**元素对常量（由每个参考体系的 `alpha(iω)` 现算再按 CN/电荷加权的参考权重组合），所以「每个元素对」的正确含义是**每一对 H–Kr 元素的中间量链路都跑得通**。新测试 `qwb-scf/tests/da06_d4_pairs.rs`：对 36×37/2 = **666 对**（含 z_i = z_j 的同核与只有 2 条参考体系的稀有气体）在 5 Bohr 处算 `properties()`，断言 CN 有限非负、EEQ 电荷有限且 Σq ≈ 0（worst **4.72e-16**）、C6 有限为正（5 Bohr 处范围 **1.565e0 … 1.263e3 Ha·Bohr⁶**）、以及交换原子顺序后 C6 不变（对称，≤ 1e-12 相对）；另一条用例钉住超范围元素**显式报错**（`Rb` → `outside the data range (36 elements: H..Kr)`）。这类错误（参考体系条数逐元素变化 2~7 条，`nref_i × nref_j` 的形状每对都不同）只会在某些对上出现，所以覆盖面测试是必要的，且成本只有 0.06 s。判据第 ① 条「与官方参数表逐项 diff < 1e-12」由 `scripts/check_d4_extract.py` 负责（36 元素 × 9 组 + 5 泛函 × 5 键，**Δ = 0**）。 **判据第 ③ 条（解析梯度有单测）落地 —— DA-06 的 §6 三条判据全部通过（本轮）**：`qwb-scf/src/d4.rs` 新增 `D4Gradient` 与 `dispersion_gradient()`：两体项 = 显式几何导数 `−C6·D'(R)·∂R/∂R_a` + `C6` 链式项（复用 `c6_gradient`）；ATM = 在平方距离变量 `u1,u2,u3` 上的**解析**导数 `∂(ang·fdmp)/∂u_k`（生产代码里没有有限差分）+ `∂C9/∂c6_pq·∂c6_pq/∂R_a`（用**原子分电荷 = 0** 的 C6 与它的 CN 链式项；`∂w/∂q` 被**显式** 置空，因为那里 q 是常量 0，不是因为「项很小」）。为了让两条路径的公式只有一份，`two_body_energy` / `atm_energy_of` / `zero_charge_weights` 被抽成共享 helper，`c6_gradient` 拆成公开包装 + 私有 `c6_gradient_from_state`（可把电荷当常量）。**三条判据的实测**：①参数表逐项 diff：36 元素 × 9 组 + 5 泛函 × 5 键，**Δ = 0**（`scripts/check_d4_extract.py`）；②每个元素对：**666 对**（H–Kr 全部 i ≤ j）中间量有限、Σq ≤ 4.72e-16、C6 在 5 Bohr 处 1.565e0…1.263e3 且对称（`da06_d4_pairs.rs`）；③解析梯度：对自身能量的 Richardson 中心差分 **5.583e-14 Ha/Bohr**（water/methane/benzene 二聚体全分量，判据 1e-8）、对官方 `gradient_max_abs` 60 行**最差相对 9.190e-10**（判据 1e-6）、平移不变性 Σ_a ∂E/∂R_a = **1.355e-18 Ha/Bohr**；另外三条能量分量与 `dispersion_energy` **逐位相等**（`assert_eq!`），`da06_d4_energy` 仍是 **6.435e-13 Ha**（重构未改行为）。 **D4 已接进引擎（本轮）**：`RksBackend::apply_dispersion` 按 `options.dispersion.data` 分派 —— `data: d4` 走 `get_d4_dispersion` + `qwb_scf::d4::dispersion_gradient`（要体系总电荷，D3 不要），其余键名仍走 D3。新测试 `qwb-engine/tests/da06_d4_engine.rs`（2 例）钉住：①可加性且 SCF 与色散数据无关（O2/STO-3G/M06-L：`d4` 时 total = −148.277449928397、E_disp = −2.2253092e-5 Ha；`d3zero` 时 E_disp = −1.038e-9 Ha，两次 SCF 那半差 < 1e-9）；②引擎的 E_disp 与直接调库逐位一致（< 1e-14 Ha），即电荷/坐标/泛函名都传对了；③d4 与 d3zero 的数值必须不同（`d4` 没被静默当成 D3）；④拼错的数据键名显式报错并列出可用键。D4 至此从数据、契约、内核到引擎全部打通。"
