  verification: "① **精度（判据 1）**：cargo test -p qwb-scf --test sc05_rimp2 绿 —— H2O/def2-SVP + def2-SVP-RI 的 RI-MP2 相关能 = **−0.2035582016 Ha**，与 canonical（SC-04）−0.2036434624 差 **8.526e-5 Ha = 0.085 mHa < 0.1 mHa**；与 PySCF 2.14.0 的 RI-MP2 −0.2035582026 差 **1e-9**；V 的秩 = 76 = 满秩（def2-SVP-RI 对水无线性相关方向）。② **报告（判据 3）**：cargo test -p qwb-engine --test sc05_rimp2_engine 3 例绿 —— correlation 块里有 method: ri-mp2、aux_basis_name: def2-svp-ri、ri_error_hartree: 8.526e-5；端到端 qwb run examples/h2o_ri_mp2_def2svp.yaml 的 result.json 同样是这四个键；RI 缺辅助基 → InvalidInput（退出码 1），辅助基不存在 → Data（退出码 3）。③ **墙钟（判据 2，实测后降级）**：苯/def2-SVP（n_orb = 114、n_aux = 372）上 **canonical 7.14 s vs RI 48.32 s = 0.15×**，即 RI 路径慢 **6.8×**，不满足「≥ 3×」。按 §2.5 记下降级：RI-MP2 保持可用（精度与报告都达标），但**不宣称性能优势**，也不作为默认路径。原因与改进方向见 note 与 docs/choices.md 五十八。"
  note: "**墙钟没有优势，这一条按 §2.5 记降级而不是改判据**。实测苯/def2-SVP：canonical 7.14 s、RI 48.32 s。分解代价可以看到为什么：canonical 版用的是 n_occ·n⁴ 的四步半变换（水/def2-SVP 只要 1.7e6 次乘加），而我们的 3 中心张量是**逐壳层三元组**用 primitive_component 现算的（苯上约 130 个辅助壳 × 2211 个轨道壳对），建 3 中心这一步就吃掉了大部分时间；RI 的经典优势（内存从 n⁴ 降到 n_aux·n²、渐近 O(N⁴) vs O(N⁵)）要靠**壳层块驱动的 3 中心构建 + 屏蔽 + 直接积分**才能兑现，那是 IN-05（并行）与 IN-04（RI-J 的 Fock 路径）的活。所以结论写成：**正确性达标、报告达标、性能未达标并记录**。另一处如实交代：引擎的 kind: ri-mp2 会**同时**算一遍 canonical 来填 ri_error_hartree（K10 第 ③ 条要求近似留痕，而 K9 的字段只能通过「与精确值比」来填），所以这个作业的墙钟比纯 RI 更慢 —— 判据 2 量的是**内核**（3 中心组装 + 白化 + 收缩 vs 4 指标半变换），两个数都在测试里打印。"
