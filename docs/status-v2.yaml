  verification: "**实测差距**（不是没试）：闭壳层情形（H2/STO-3G）ROHF ≡ RHF 精确通过（差 < 1e-9、`n_open = 0`），说明闭壳层那段机制没问题；开壳层情形两种缩放都失败：取梯度一致的 2:1:1 缩放（闭⊕虚 = 2F_C、闭-开 = F_β、开-虚 = F_α）时**收敛**但落到错的驻点（O2 E = −147.2212 vs PySCF ROHF −147.6322，差 **0.411 Ha**；OH −73.239 vs −74.3616，差 **1.12 Ha**）；取统一尺度 1:1:1 时 400 步不收敛。"
  gap: "差 0.41 Ha（O2）/ 1.12 Ha（OH）；纯自旋的 `⟨S²⟩ = S(S+1)` 因此也拿不到（第一版只能报 UHF 的 2.0034）"
  note: "**卡在哪**：等效 Fock 的 C-O / O-V 混合块不满足驻点条件。已确认的两个具体原因：① 缩放不能按梯度的 4:2:2 直接套 —— `F_eff` 的本征值同时决定占据顺序，把闭⊕虚块乘 2 会让闭/开壳层轨道能级不可比，aufbau 会把闭壳层轨道误判成开壳层（这是 0.41 Ha 那个解的直接来源）；② 统一尺度又让迭代矩阵条件数变坏（400 步不收敛）。**下一步两条路**：A. 按 Guest–Saunders 原文（或 Faegri–Manne 的耦合系数表）重新推导 C-O/O-V 块，并加「轨道身份跟踪」（不靠本征值排序定占据）；B. 换成「轨道旋转直接优化」：用真实能量梯度（我推导的那三个块公式是对的，可用有限差分验证）做线搜索 —— 这条路不依赖等效 Fock 的正确形式，但要多写一个优化器。当前按 §2.5 记 blocked，不阻塞 M1b（UKS）与 M2。"



