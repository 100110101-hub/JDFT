  verification: "**三条 GPU 结论各带实测，第四条（XC）本轮补测并给出成本分解**。① gemm 原语：GPU vs CPU 最大绝对差 **5.55e-16**（判据 1e-12），吞吐 512³ **10.8 GFLOPS** / 1024³ **124** / 2048³ **173**（RTX 3070 Laptop，8 GiB，CUDA 13.0）。② **AO→MO（T1）已接线**：GPU vs CPU **6.9e-17**、加速 **60.8×**（`qwb-response` 的 `gpu-kernel` feature 下走 cuBLAS，默认构建原样）。③ **J 构建判 wontfix（有实测）**：稠密 4 索引在 n=150 就占 47% 显存、n=200 需 12.2 GB（超 8 GiB）；RI-J 两次收缩是 gemv 形状、算术强度 **0.5 flop/byte**（n=60/100/150/200 同值）→ 内存带宽支配；实测 n=60/n_aux=180 时 naive 0.002 s vs GPU 核 0.209 s（**0.0×**，每次调用建/销 handle 与显存分配盖过 2e6 flops）；同卡 2048³ gemm 有 173 GFLOPS 是形状不同，不是 kernel 写得好。④ **XC（本轮补测）**：H2O、grid-normal、72 900 个格点，把网格 XC 拆成三段 —— AO 缓存（与密度无关、SCF 只付一次）**0.13 s**（STO-3G，n=7）/ **0.29–0.70 s**（def2-SVP，n=24，含 σ/τ 需求）；每步的缩并+泛函 **0.031/0.080/0.160 s**（n=7 的 svwn5/pbe/m06-2x）与 **0.199/0.490/0.678 s**（n=24）；其中**只算泛函** 0.008/0.030/0.101 s，占每步 XC 的 **26%/37%/63%**（n=7）与 **4%/6%/15%**（n=24）。⑤ 顺带修掉一处每步都在付的浪费：`evaluate_xc_cached` 曾对每个格点 clone 三个 `Vec`（φ、∇φ、∇²φ）并再拷进 Vec-of-Vec，等于每步 2·n_points·5n 个双精度的分配与拷贝（n=24、72 900 点约 70 MB/步）；改成借用缓存后每步 XC **0.038→0.031 / 0.098→0.080 / 0.182→0.160 s**（n=7，1.14–1.23×）与 **0.214→0.199 / 0.523→0.490 / 0.740→0.678 s**（n=24，1.07–1.09×），且 `xc_grid_bit_pattern` 证明 **E_xc 与 v_xc 逐位不变**（`0xc013_1c6c_993b_7753` 等四条锚点）。⑥ `cargo test -p qwb-scf` 全绿（含 2 条新测试）。⑦ **显存不足自动回退（第 376 轮）**：`cargo test -p qwb-gpu` **13 例绿**（4 个新例）。实测本机 `free 7116 MiB / total 8191 MiB`（RTX 3070 Laptop），默认预算 = 空闲的 75 % = 5337 MiB；预算比需求少 1 字节时 `gemm_f64_budgeted` 返回 `InsufficientMemory { required: 15104, available: 15103 }`（**分配之前**返回，可脱离真实 OOM 复现）；`gemm_f64_with_fallback` 在 GPU 可用时走 `GemmRoute::Gpu`（与 CPU 差 < 1e-12）、预算逼死时走 `Cpu` 且结果与 CPU 路径**逐位相同**；`gemm_bytes(1000,1000,1000) = 24 MB` 有专门断言。顺带修掉惰性初始化竞态：`cublasCreate_v2` 在无 context 时返回 1、`cudaMemGetInfo` 返回 801，`init()` 里先 `cudaFree(0)` 之后两个测试并发也稳定。 **第 412 轮（XC 格点核，NVRTC/cubin 不安全面）**：先探针确认环境（`nvrtc64_130_0.dll` 13.0、`nvcuda.dll`、RTX 3070 8 GiB / compute 8.6、40 SM；PTX 编译 + `cuModuleLoadData` + `cuLaunchKernel` 全部 status 0，最差 |gpu−host| 0.000e0）。新增 `qwb-gpu/src/jit.rs`（**全部 31 处 unsafe 只在这里**，每处带 `// SAFETY:`，共 33 条）与 `qwb-gpu/src/xc.rs`（100% 安全 Rust 的数值/调度层），`xc_grid_lda` 走 NVRTC 编译 `qwb_xc_row_dot`（常量源码、不接受用户输入）。**A1**：XC 总能量与 CPU **逐位相同**（`|ΔE| = 0.000e0` Ha：STO-3G −9.072705066997624 / def2-SVP −8.977352145670903，密度来自本仓库自己的 `rks_scf`+svwn5），`v_xc` 最差 **2.931e-14 / 5.562e-14**（量级 2.94，相对 ~1e-14），远严于 1e-10 判据。**A2 加速比（如实记负结论）**：n=7（STO-3G）**0.26×（更慢）**，n=24（def2-SVP）**1.44×**（55.5 → 38.5 ms，warm-up 2 / reps 5 / 取 min）；小体系慢是因为启动与两次 H↔D 往返吃掉 4.8 ms 的活，正是账本里「算术强度 n/4」分析预测的边界，不是实现问题。**A3 自动回退**（三条独立路径，全部逐位等于 CPU 基准）：`force_cpu`、显存预算少 1 字节、`QWB_GPU_XC_DISABLE=1`；另把 CUDA bin 目录硬链成**没有 NVRTC** 的版本，整轮仍绿并给出原因（「找不到 nvrtc64_*.dll … 可整体退回 CPU」）。**A4**：`qwb-scf` **逐字节未改**，`xc_grid_bit_pattern` 的冻结位型全部复现（E_xc `0xc0131c6c993b7753` 等）。**A5**：`cargo fmt --all --check`、`cargo clippy --workspace --all-targets -- -D warnings`（含 feature 版）、`check_unsafe.sh` / `check_deps_centralized.sh` / `check_rayon_determinism.sh` 全绿。**边界可执行化**：`tests/unsafe_boundary.rs` 扫描 `src/` 全部 `.rs`，断言 `unsafe` 只出现在 `jit.rs`，并有三条非空性保证（冻结计数 68、内存里植入 `unsafe` 后必须报 `lib.rs 1`、磁盘上植入 `t1.rs` 后当场红）。**本轮缺口（仍未标 done 的原因）**：只有 **LDA 通道**上了 device（GGA/meta-GGA 要 ∇Φ/∇²Φ/τ 的另几个核，未写；传入 GGA 项会**显式报错**而不是静默返回 LDA-only）；**没有接进 `qwb-scf` 的产品路径**（与已发货的 T1/RI-J 同型，只在 `gpu-kernel` feature 下可用）。 **第 417 轮（GGA 通道上 device）**：新 kernel `qwb_xc_gga_rho_grad`（每线程一个格点）算 `ρ_p = Σ_i Σ_j Φ_i P_ij Φ_j`（i 外 j 内、不跳零）、`∇ρ_p = Σ_i Σ_j P_ij(∇Φ_i Φ_j + Φ_i ∇Φ_j)`、`σ_p = |∇ρ|²`，并按 CPU 的求和顺序写回；`v_xc` 组装复用 `scale_rows`/`gemm_v`（LDA 半 `Φᵀ(a∘Φ)` 加三支 `M_a = ∇Φᵀ_a(s_a∘Φ)` 折成 `M_a + M_aᵀ`）。**逐位相同靠 `__dadd_rn`**：普通写法会被 NVRTC 融合成 fma，实测 PTX 里普通表达式出 **7 条 `fma.rn.f64`**、`__dadd_rn` 出 **0 条**（只有 `add.rn.f64` + `mul.f64`）—— 这是能量能逐位相同的原因。**正确性（pbe 与 b88，各两档）**：`|ΔE| = 0.000e0` Ha **逐位相同**（pbe STO-3G −9.365265694001241 / def2-SVP −9.268159243232311；b88 −9.069600432555141 / −8.984780659551353），`v_xc` 最差 **4.541e-14 / 6.928e-14 / 2.731e-14 / 6.695e-14**（量级 ~3.08，相对 9e-15…2.2e-14），而且 `ρ`/`∇ρ`/`σ` 在**全部 72 900 个格点上逐位相同**（断言，不只是打印）—— 能量相同是这个的推论而不是容差运气。**加速比（warm-up 2 / reps 5 / 取最小）**：只算收缩段（平凡泛函）n=7 **2.76×**（43.3 → 15.7 ms）、n=24 **10.66×**（445.1 → 41.8 ms）；整个 XC 步（真 PBE，host 上仍做泛函求值）n=7 **1.52×**（85.9 → 56.4 ms）、n=24 **6.24×**（495.1 → 79.4 ms）。**覆盖比例是量出来的**：def2-SVP 下收缩段占整步 445.1/495.1 ≈ **90%**、STO-3G 下 43.3/85.9 ≈ **50%**（host 泛函在那儿和整个收缩段一样贵）；设备侧时间分解实测上传 11.6 + kernel 11.2 + 下载 1.1 + 四次 gemm/scale 约 9.3 ms ⇒ **约 28% 的 GPU 时间花在 H2D 传输上**（Φ/∇Φ 每次重传，未做常驻）。**回退**：`force_cpu` / 预算少 1 字节（24496360 vs 24496359）/ `QWB_GPU_XC_DISABLE=1` / 无 NVRTC（`QWB_CUDA_LIB_DIR` 指空）四条路径全部 `path = Cpu` 且**逐位相同**（0/49 元素不同），`ex03_xc_fallback` 10 例绿。**unsafe 边界不变（68 次，只在 `jit.rs`）**：新 kernel 走既有 `launch` 包装，句柄复用重构把三段并入「create + gemm + destroy」净零，边界测试全绿 —— 没有偷偷改冻结常量。**还缺**：BLYP 不可用（`qwb-data/functional/` 没有 blyp 文件，且 `GgaLypC` 要 `∇²ρ`）；`∇²ρ` 与 `τ` 通道未实装（传给 kernel 的项若 `requires()` 它们会**显式报错**）；**未接进 `qwb-scf` 产品路径**（`evaluate_xc_cached` 仍跑 CPU，所以加速比是「收缩段单独计时」而不是端到端产品增速）；`v_xc` 不逐位相同（gemm 重排求和，相对 1e-14 量级，与 LDA 同型）。**本轮修掉一个真缺陷**：`xc_grid_gga` 起初漏了 `validate_gga`，短切片会越界读，被新加的 `gga_shape_errors_are_reported_not_panicked` 当场抓住并修好。 **第 419 轮（设备驻留 + 接进产品 SCF 路径；EX-03 收口）**：`qwb-scf` 新增一个**默认 Cpu** 的 XC 路径选项与 trait 钩子，`qwb-gpu` 实现它、引擎注入（保持依赖方向，未造出环），`gpu-kernel` feature 下才可达；`Φ`/`∇Φ` 改为**设备驻留**（网格与基组不变时只上传一次）。**驻留前后（同一轮实测）**：STO-3G 22 次收缩 —— 上传次数 **22 → 1**、上传字节 423 411 824 → 80 490 224、上传阶段 215.0 → 18.7 ms、设备合计 **907.8 → 519.0 ms（1.75×）**、SCF 2.042 → 1.672 s；def2-SVP 26 次 —— 上传 1 531 603 008 → 131 923 008 B、384.5 → 20.5 ms、设备合计 **1 069.6 → 693.2 ms（1.54×）**、SCF 2.884 → 2.517 s（省下的字节数正好是 `(n−1)×每次字节`，可对上）。**端到端 SCF（PBE，产品路径）**：STO-3G CPU 2.129 s / GPU 1.907 s = **1.12×**（|ΔE| = 7.105e-14 Ha）；def2-SVP CPU 13.541 s / GPU 2.587 s = **5.23×**（|ΔE| = 1.279e-13 Ha）—— 两者都远严于 1e-10，但**不是逐位相同**（`v_xc` 的 gemm 重排求和会经密度反馈到下一步，这一点与「单次 XC 步逐位相同」不同，如实记）。**回退**：显存预算 1024 B → `路径 Cpu，原因「qwb-gpu xc_device：显存预算不够：需要 24496360 B，预算 1024 B」`，能量与 CPU **逐位相同**；另有无 NVRTC / feature 关闭 / CUDA 缺席三条路径（`ex03_cuda_absent` 1 例绿）。**A3 默认路径未变**：默认构建（feature off）与 feature-on-baseline（Cpu 路径）下，`xc_grid_bit_pattern` 冻结位型与既有测试全部不变、`cargo test --workspace` 绿。**A5**：`cargo fmt --all --check` 干净；`cargo clippy --workspace --all-targets --features qwb-gpu/gpu-kernel -- -D warnings` 干净（默认构建的 clippy 在门禁里另跑）；`check_unsafe.sh` 通过（唯一批准点仍是 `qwb-gpu/src/jit.rs`）；`check_deps_centralized.sh` 通过。**残留（不阻塞 EX-03 的验收）**：BLYP 仍不可用（数据域无 blyp 文件 + `GgaLypC` 需 `∇²ρ`）；`∇²ρ`/`τ` 通道未实装（需要它们的项显式报错）；设备驻留只对「网格与基组不变」的 SCF 迭代有效，网格换档时会重传。"
  gap: "**XC 的 GPU 化卡在「需要自定义 kernel」，不是卡在算法**：收缩段（占每步 XC 的 85–96%，n=24）是 `O(n_points·n²)` 的稠密乘法，算术强度约 `n/4` flop/byte（n=24 时 **6 flop/byte**）→ 内存受限；它的第二步是**逐元素行点积**（`ρ_p = Σ_μ Φ_pμ (ΦP)_pμ`），BLAS 没有这个原语（gemm 只能给到 `(ΦP)`），所以必须写 elementwise kernel。而当前的 unsafe 白名单只批了 **BLAS FFI**（`libloading` + cuBLAS），写自定义 kernel 要引入 NVRTC 或预编译 cubin —— 那是**新的 unsafe 面**，按 R-16 需要人类批准并更新 `unsafe_allowlist.txt`。**收益上限也不高**：功能求值只占 4–15%（真实基组），单独 GPU 化它最多 ~1.15×；收缩段要赢还得把 Φ（14 MB）常驻显存、每步只传 ρ/σ/τ 与 P（P 仅 4.6 KB），否则 PCIe 往返吃掉收益（RI-J 已经实测过一次 0.0×）。**解开条件**：① 人类批准 NVRTC 级 FFI（或允许把 cubin 进仓库）；或 ② 换专业卡/更大体系使收缩段的绝对量级上去。在此之前维持 blocked，且**默认路径与 CPU 位模式一行未动**。"
  note: "**为什么先测再写**：附录 A 要求「加速比实测记账」，而 GPU 代码一旦接进默认路径就要重新论证 CPU 位级回归（`127a91e`）。本轮把 XC 拆成三段量完，结论是「功能求值占比小、收缩段是内存受限且需要自定义 kernel」——与 J 的结论同型（choices 九十一/九十二/九十三），所以同样按 §2.5 记 blocked 而不是硬写一个不会赢的 kernel。**已交付且可回退**：gemm 原语、T1（AO→MO）两条真正 gemm 密集的核（5.55e-16 / 6.9e-17，60.8×），以及本轮的 CPU 拷贝消除（位级不变）。门禁不依赖 GPU：`--features gpu-kernel` 打不开时自动走 CPU。 **第 411 轮解封（人类决策，`project-phase2.md` v3.2 附录 A · EX-03 与 `choices` 二百）**：XC 核**允许使用 NVRTC/cubin 不安全面**，但锁死在 `qwb-gpu` 的 JIT/驱动绑定层**一个模块**（`src/jit.rs`），其余 crate 与模块继续 `#![deny(unsafe_code)]`；内核源码是常量字符串、不接受用户输入；参数表 `#[repr(C)]` 逐项对齐，由 1e-10 Ha 的 GPU≡CPU 一致性兜底；feature-gated，无 GPU 时该模块不参与编译，CPU 路径位模式一字不变。所以本项不再是 `blocked`（判据阻塞已消除）。状态回到 `in_progress` 而不是 `pending`：gemm 原语（5.55e-16）、AO→MO（60.8×）、显存预算与自动回退**都已交付**，缺的只是 XC 那一个核（收缩段的内存受限逐元素行点积，BLAS 没有这个原语）。"
  choices: "九十一、九十二、九十三、九十四、一百三十七"
