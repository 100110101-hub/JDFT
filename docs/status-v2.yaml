  plan: "**可执行的两个数（choices 一百零九）**：CPHF（3N 次响应）+ 2e 导数核快 **k ≥ 7.7** → 20×。推导：每响应 ≤ 0.125 s 才能把 27 次响应压到 3.37 s 以下；0.0441 + 0.6252/k ≤ 0.125 ⇒ k ≥ 7.7。单独做任一条都不够：只优化积分上限 15.2×（2e 降到 0 也只有 15.2×）；只做 CPHF 约 2×。顺序：先 CPHF（6N→3N，复用 `qwb-response::cphf` 的 (A+B) 与 T1/T2），再攻 2e 导数核的 8×。"
  decomposition: "**实测分解（choices 一百零八，`QWB_GRAD_TRACE=1`）**：一次梯度遍次 0.6693 s，其中 **2e 导数 0.6252 s = 93.4%**，其余 0.0441 s。推论：设 2e 导数加速 k 倍，整遍次加速 = 1/(0.066+0.934/k)——k=10 → 6.1×、k=20 → 10.6×、2e 降到 0 也只有 **15.2×**。**所以 20× 不可能只靠优化 2e 导数积分**，必须同时把 Hessian 构造换成 CPHF 二阶导（3N 次响应，而不是 6N 个位移几何）。"
  decision: "**2026-11-07 用户拍板：判据不降级**（拒绝把 20× 改成实测 2×），改走 **2e 导数层重写**（Rys/Hermite 带导数指标）。因此 RS-05 继续 blocked、判据不动；RS-06/RS-07/RP-01..04 继续 blocked-by-dependency。下一步主线：先拆解单次导数遍次 7.188 s 的构成（2e 导数 / 1e 导数 / XC 几何 / Pulay+CPHF），确认 2e 导数占比，再决定重写能拿回多少。"
