    * **LYP**（`GgaLypC`）：三通道导数都对五点差分一致（d/dρ、d/dσ、d/dL）；
      均匀电子气极限 `ε_c = −a[1 + b·C_F·e^{−cρ^{−1/3}}]/(1+dρ^{−1/3})` 逐点相对差 < 1e-13。
    * **三通道的变分自洽**（`lyp_variational.rs`）：给密度矩阵加扰动 `ΔP = s·M`，
      `ΔE` 与 `Tr(v·ΔP)` 的残差随 s **线性**下降（3.4e-9 → 3.4e-11 → 3.4e-13）。
      这是整个三通道管线（含 `∇²(φ_μφ_ν)` 矩阵元）作为「真变分导数」的证明。
