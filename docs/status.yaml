    **已归因并修复（2026-10-24）。** 缺口 2.09-2.36 Ha 的根因是 **Boys 函数在大 T 下整体失效**，
    不是核吸引、不是 2e、不是 SCF、也不是基组数据：向下递推固定 padding 40 起步时，种子误差被放大
