  note: "**两个真 bug 都修掉了**：① 旧实现的角动量直接相加、丢掉 (P−A)、(P−B)——s 型看不出来（所以 H2/STO-3G 一直精确到 0.3 µHa），p/d 型全错；② 改写后在 ∂^t F₀ 前多乘了 (−1)^t（2e 那边 (−1) 落在 ket 的 E 系数上，两者约定本就不同），症状是误差随 X·F₁ 项的大小而变：p_z 差 59%、p_x 只差 3%、d_xx 差 1.1%——正是这个梯度把它指认出来的。修完后水/STO-3G/SVWN5 跑到 −74.6576 Ha（此前 −88.72 → −78.08），MO 能级 [−18.48, −0.851, −0.427, −0.198, −0.044] 落在 LDA 的合理范围。**注意**：T2 的『水/def2-SVP/PBE + 偶极』还差 GGA（F 轨）与性质计算（S-06），本 WP 只把一/二电子积分与核吸引的 p/d 部分补齐。\n\n    **新发现的未收口项（水/STO-3G 的 HF）**：MO 能级已经高度吻合文献——我们 [−19.24, −1.24, −0.61, −0.44, −0.38]，文献 [−20.2, −1.20, −0.55, −0.42, −0.35]——但总能量是 −72.876 Ha，文献 −74.963，差 **2.09 Ha**，而且差异集中在深核（1a1 偏低 1 Ha，正好 2 电子 × 1 Ha ≈ 2 Ha）。所以不是全局归一化问题，而是**大指数（O 1s 的 ζ≈130）相关的某个积分**还不准；核吸引的点电荷极限只在 α∼1.5 上验证过。回归用例 qwb-scf/tests/t02_water_hf.rs 已按 #[ignore] 留下并写明实测值，不会让已知错误变成绿灯。下一步：把点电荷极限测试推到 α∼100–300 量级，定位是大指数的核吸引、2e 还是动能项。

    **本轮排查结果（已排除的方向，避免重做）**：① s 型 S/T/V 与教科书闭式在 α = 0.1…300 全范围一致到 1e-16，所以大指数本身没问题；② 2e 在极端指数比（130 vs 1.5、300 全紧、bra/ket 混合）下与独立数值路径一致（≥1e-9；`all-tight` 行的 1.7e-1 是参照值 ~1e-23、纯差分噪声，不可用）；③ 水/STO-3G 的 s 子块与独立收缩一致到 4e-16，(O1s O1s|O1s O1s) = 4.78507，与 Slater 1s 的解析 (5/8)ζ（ζ=7.66 → 4.79）吻合。④ **维里检验**：Tr(P·T) = 74.477、Tr(P·V) = −194.799、E_2e = 38.251、E_nuc = 9.194，于是 E + T = **+1.60 Ha**，与 2.09 Ha 的能量缺口同量级——说明波函数本身接近驻点、自洽没问题，缺口在积分里而不是 SCF 记账里。⑤ 因此嫌疑收缩到「紧函数与 p 函数混合的 2e 积分」这一类（如 (O1s O2p|O1s O2p)）。

    **本轮追加的排除与确认**：⑥ 用独立数值路径（原函数级导数 + 我们的收缩权重）核对了水张量的 7 个含 p 元素——(00|22)=1.115813819、(02|02)=0.024477411、(23|23)=0.047444444、(11|33)=0.817022591、(22|56)=0.139366865 等，与参照相对差 ≤ 2.3e-6（(01|23)、(02|55) 由对称性恰为零）⇒ **2e 张量是对的**，该类嫌疑也排除。⑦ 能量与 Fock 自洽性：用库函数独立重算，Tr(PH)+E_2e+E_nuc 与 ½Tr(P(H+F))+E_nuc 都等于上报的 −72.8758116904（差 1e-9）⇒ **SCF 记账没有错**，我们的解就是这套积分的真正 RHF 解。⑧ 参照值已核实：NIST CCCBDB（Release 22）给出 HF/STO-3G 水 = **−75.204892 Ha**（STO-3G 优化几何 O–H 1.0191 Å、∠HOH 97.437°，`cccbdb.nist.gov/energy3x.asp?method=59&basis=20&casno=7732185`），实验几何下约 −74.96 ⇒ **2.1 Ha 的缺口是真实的**，不是记错文献。⑨ 基组数据也已逐壳核对（O 的 1s [130.7093, 23.8089, 6.4436]/[0.15433,0.53533,0.44463]、2s [5.0332,1.1696,0.3804]/[−0.09997,0.39951,0.70012]、2p 同指数/[0.155916,0.607684,0.391957]）与 Hehre–Stewart–Pople 原始 STO-3G 一致。

    结论：单看任何一个积分族都正确、能量与 Fock 自洽、数据正确、文献参照正确，但总能量差 2.1 Ha——这说明**还有某个与「多个非零角动量壳层同时存在」有关的组合错误**没被单点测试覆盖（例如 1e 的球谐变换与 2e 的球谐变换在 p/d 壳层上使用了不同的分量顺序，而两者在单壳层测试里各自自洽）。下一步应直接比对「1e 与 2e 看到的同一个 p 分量」：把 p_x 只放在一个壳层上，比较 S/T/V 与 2e 张量的分量映射是否一致。

    **本轮（26）的新证据——把怀疑对象从「接线」转到「T/V 配比」**：⑩ 喂给核心 Fock 元的**全部 98 个张量元素**（(00|kl) 与 (0k|0l)，k,l 遍历 7 个 AO）与独立数值路径**逐一相等**（最差 0.0）⇒ 分量顺序/接线没问题，上一轮的候选被排除。⑪ 在 CCCBDB 的精确几何上（O(0,0,0.134)、H(0,±0.766,−0.538) Å）我们得 HF = −72.845583、E_nuc = 8.654465（CCCBDB 的 E_nuc = 8.653349，差 1.1e-3 来自坐标四舍五入）⇒ 几何与核排斥都对。⑫ **维里定理是决定性的**：该几何正是 STO-3G 的平衡结构，HF/STO-3G 在此处必须满足 2T + V_tot = 0；实测 T = 74.48、V_tot = Tr(PV)+E_2e+E_nuc = −147.36，得 **E + T = +1.60 Ha**。既然能量与 Fock 彼此自洽、所有积分族又都正确，剩下的解释就是 **T 与 V 的配比**：T 偏大约 0.8 Ha 或 V 偏小约 1.6 Ha（或等价地核吸引矩阵的某个系统项）。⑬ 核心 F_00 拆解：H_00 = −31.711、J_00 = 17.376、K_00 = 9.763 ⇒ F_00 = −19.217（1a1 = −19.237），比文献的 1a1 ≈ −20.20 高约 0.98 Ha。下一步：在**H2/STO-3G 的已知极小点**上做同样的维里检验来标定 T/V 是否有系统偏差。

    **本轮（27）：维里论证被撤回，它是错的。** 在 H2/STO-3G 上跑同样的检验：R=0.70/0.74/0.80/1.00 Å 时 E + T 分别是 9.4e-2 / 8.5e-2 / 7.7e-2 / 9.8e-2 Ha，而 E(R) 的极小点确实在 R≈0.74 Å（E = −1.11676，与文献一致）。也就是说**最小基组下维里破坏本来就有 7.6%**（STO-3G 的波函数不是真正的本征函数，标度条件本就不成立），水的 1.6 Ha（2.2%）反而更小。因此上一轮「维里破坏 ⇒ T/V 配比错」的推理无效，那条线索作废，不要重走。

    **补充验证**：O 1s 与 H 1s 的**收缩对角元**与闭式（T = (αβ/p)·3·(π/p)^{3/2}、V = −Z(2π/p)F₀）逐一相等（T_00 = 29.00320407、V_00 = −60.71419141，相对差 ≤ 3e-16）。至此 S、T、V、张量、核排斥、SCF 记账、能量-Fock 一致性、基组数据、外部参照**全部单独验证通过**，而水/STO-3G 的 HF 仍差 2.36 Ha——这在逻辑上只能说明「某个共享组件被两套测试以同样方式用错」，或者「rks_scf 在把 H 与张量组装成 F/E 时有一条我还没检查的路径」。

    ⑧ 手写最小独立 RHF（自带 S^{-1/2} = U diag(1/√λ) Uᵀ、朴素四重循环算 J/K、不动点迭代 27 步收敛）给 E = −72.8758116897，rks_scf 给 −72.8758116904，**差 7.1e-10** ⇒ SCF 无罪，问题在输入。
    ⑨ 换分子：CH4/STO-3G（R=1.09 Å 正四面体）E = **−36.297452**，文献 ≈ −39.727，差 **3.43 Ha**；MO [−9.35, −0.81, −0.435×3, +0.883×3, +0.974] vs 文献 [−11.06, −0.945, −0.542, 虚轨道 +0.31/+0.36] —— 核心偏低、虚轨道偏高，说明不是水独有，而是随 p 轨道出现。
    ⑩ 整个核吸引矩阵 49 个元素用「极窄 s 压到核上的 2e 极限」复核，最大相对差 **1.9e-4**（位于 (0,0)，量级正好是 γ=1e5 的截断误差 p/(4γ)）⇒ V 无误。
    **本轮（29）：S 与 T 也都验证通过，并且发现误差是「每个重原子一个常数」。**
    ⑪ 用 200 点 Gauss–Legendre 的**一维数值积分**（区间按该对原函数的高斯宽度缩放）独立重建了水/STO-3G 的**整个重叠矩阵 S（49 个元素）与动能矩阵 T（49 个元素）**，与被测代码的绝对差分别 < 1e-9 与 < 1e-8 ⇒ S、T 无误。（过程中我自己写错两次二阶导数公式，第一次漏了 −2β(2n+1)uⁿ 项，把 T 算成负值——动能不可能为负，正是这个物理约束提醒我错在参照而不是代码。）
    ⑫ 基组本身也确认无误：按 Slater 的 ⟨1/r⟩ = ζ/n 核对，O 1s 得 7.577（ζ=7.6578）、2s 得 1.131、2p 得 1.122（ζ/2 = 1.138），全部符合 ⇒ 三个壳层都是合格的 Slater 拟合。（我第一次把公式记成 ζ/n²，才误以为差 2 倍。）
    ⑬ **关键的新线索**：误差几乎正好是「每个重原子一个常数」。H2O 差 2.36 Ha，其 1a1 偏高 0.94 Ha × 2 个电子 ≈ 1.9；CH4 差 3.43 Ha，其 1a1 偏高 1.70 Ha × 2 ≈ 3.4。两个分子都只有一个重原子（O / C），误差 ≈ 2 × 该重原子核心轨道的偏移。所以问题不是「p 轨道整体」，而是**重原子 1s 核心**这一项。

    下一步（范围已经很窄）：核心 Fock 元 F_00 = H_00 + J_00 − ½K_00，其中 H_00 与张量元素都已独立验证，所以只剩**密度 P** 与**求和路径**。

    **本轮（30）**：① 复核了能量公式的代数（Σ_ij 2J_ij = ½Tr(PJ)、Σ_ij K_ij = ¼Tr(PK) ⇒ E_2e = ½Tr(P(J−½K))），与实现一致，公式无误（我之前口头说的 Tr(PJ) − ½Tr(PK) 是错的，记在这里以免再被误导）。② 想用 LiH（2 个占据轨道 + p 函数）做交叉验证，但 **STO-3G 数据只覆盖 H/C/N/O/F**，没有 Li ⇒ 该路走不通（也说明可用的验证分子只有 CH4/CH3OH 这类，而 CH4 已测）。③ 尝试从 CCCBDB 取水的轨道能级，但该页只返回查询表单（URL 参数对该页不生效），未取到数据。

    **本轮（32）补充**：① 水的对称伸缩能量曲线（固定键角，R_OH = 0.90…1.30 Å）显示极小点在 **R_OH ≈ 1.0–1.1 Å**（STO-3G 的已知平衡键长约 0.99 Å ✓），而整条曲线相对参照值有**近乎常数 ~2.36 Ha 的偏移** ⇒ 与「核心轨道贡献错了一个常数」的假设一致（核心不随几何变化），而不是键或几何相关的错误。② Python 独立实现的 p 型部分仍未修好：`v_ss` 补齐后能跑，但 p 型核吸引/2e 的**嵌套差分被舍入放大**（每层除以步长；步长 4.5e-4 时 1/h² ≈ 5e6，结果 2.5e7），改用固定步长 0.01 + 五点四阶 stencil 后仍不对（V[2,2] = 6.9e4，(00|22) = 0.135 vs Rust 1.116）⇒ 除了数值问题，还有一处**结构性倍率**没找到。脚本状态已写进文件头。

    **本轮（33）：Boys 函数的教训 + 核吸引再获独立确认。** ① 发现 Python 版 Boys 函数是错的：向下递推的起点必须取在 `m_max` 之上足够高处（Rust 用 `m_max+40`，见 `boys.rs`），否则 `F_m`（m≥1）严重偏低——我最初把起点直接放在 `m_max`，导致 p 型积分全是垃圾值。修好后 Python 立刻给出 **V[0,0] = −60.71419138940649、V[1,1] = −10.141913040915586**，与 Rust 的 −60.71419141 / −10.14191306 **完全一致** ⇒ 核吸引矩阵又获得一次独立实现确认（这是第 4 条独立证据）。② Python 的 p 型仍为 0：**解析导数状态法不够用**——一阶导之后，系数 `d_e`、`d_t` 本身仍依赖中心坐标，二阶混合导数必须对这些系数再求导（在 A=B 处一阶导为零、但二阶导不为零）。要做到这点就得复刻 Hermite 系数那一套，而那就失去「独立」的意义了。**结论：Python 这条独立路线对多阶导数不可行**，只能确认 s 型（S/T/V/s-s 2e）——已完成。

    **本轮（43）：确认 SCF 到的是唯一极小点，误差不在收敛。** 从三个**故意不同**的初猜出发（core guess、占据**最高**轨道的密度、对角均匀密度），三条路都收敛到**同一个** E = −72.8758117（分别 13/14/9 步）。这排除了「陷入局部极小 / 收敛到错误解」这一整类可能——我们的解是这套积分的唯一驻点。另外测了 HF 分子（−97.375 vs 记忆值 ≈ −98.57）与 CO（−100.366 vs ≈ −112.6），但这两个"文献值"未经核实，只作观察记录，不作为证据。

    **结论与求助**：I-02 现在处于「所有内部一致性都通过、只差一个可信外部参照」的状态。已尝试且不可用的外部途径：pyscf（本机装不上，无对应 wheel 且源码编译失败）、Basis Set Exchange API（http↔https 重定向环）、PowerShell 直连（网络失败）。**若能提供以下任意一项，相关 WP 可立刻推进**：① 水的 HF/STO-3G 总能量（含几何与软件出处）；② cc-pVDZ / def2-TZVP 的基组文件（.gbs/.yaml 皆可），用于 D-05/D-06；③ 一份可引用的 298.15 K 介电常数表，用于 D-14。
    * S 矩阵：S[0,0] = 1.0000000000485125、S[2,2] = 0.9999999999800491 —— 与 Rust **逐位相同**；
    * T 矩阵：T[0,0] = 29.003204066085107 —— 与 Rust **完全相同**；
    * (ss|ss) 型 2e：(00|00) = 4.78506575227999 —— 与 Rust **完全相同**。
    这三项一致，说明「S/T/s-s 2e 里存在被所有 Rust 测试共享的错误」这个假设不成立；剩下的嫌疑集中在 **p 型核吸引与 p 型 2e**。脚本的这两处（导数递归复合）还没修好，运行到会抛错，已在文件头标注状态与下一步，下一轮只需补这两处即可得到完整的独立 HF 能量，从而把 2.36 Ha 定位到具体矩阵元素。
