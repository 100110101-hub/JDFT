    **两处门禁自身漏洞（都修在这里，免得"全绿"被误读）**：

    ① `scripts/check_unsafe.sh` 的 step 2（扫描 unsafe 用法）在"没有命中"时直接 `exit 0`，
    把 step 1（每个 crate 必须声明 `#![deny(unsafe_code)]`）的失败吞掉了。后果不是假想：
    `qwb-props` 从创建起就**没有**这条 deny，而这个脚本一直退出 0，于是之前几轮的
    "ALL GATES GREEN"在这一项上是空的。修法：两个 step 计入同一个 `$fail`，末尾统一 exit，
    并补上 `ok: unsafe policy satisfied` 的正向输出。验证：临时去掉 `qwb-props/src/lib.rs`
    的 deny 行 → 脚本打印 `FAIL ...: missing deny(unsafe_code)` 并 exit 1；恢复后 exit 0。

    **第 50 轮先红了一次**（如实记）：`test_engine_binding.py::test_two_concurrent_jobs_overlap`
    报 "two concurrent runs took 1.30s vs 0.84s single"—— 判据是 `wall < single*2*0.75`，
    实测 1.297 s 对阈值 1.266 s，差 2.5%。这是**判据太贴噪声**（单个作业只有 0.8 s，
    调度抖动轻松吃掉 5%），不是 GIL 没释放；改成"三个并发、阈值 0.8×串行和"
    （持锁时 ≈ 3×单个、释放后 ≈ 1.5×单个），同一台机器上稳定通过。

    ② `scripts/check_deps_centralized.sh` 在 Windows 上把 `[dependencies]` 段内的空行判成
    "没写 `workspace = true` 的依赖"——原因是本仓库开了 `core.autocrlf=true`，磁盘上的文件是
    CRLF，而 bash 的 `read` 只按 LF 切行，空行读出来是 `"\r"`（非空）。这不是规则被绕过，
    是**报错报错了行**：修法是在 `read` 之后剥掉行尾的 `\r`（`line="${rawline%$'\r'}"`），
    规则本身一个字没改；同时把 `qwb-cli/Cargo.toml`（P-10 加了 5 个依赖）重新写成 LF，
    与其它 crate 保持一致。验证：临时造一个 `qwb-core/crates/zz-tmp/Cargo.toml`
    （`serde = "1.0"`，不带 `workspace = true`）→ 脚本打印
    `FAIL ...:5: dependency must inherit ...` 并 exit 1；删掉之后 exit 0。

