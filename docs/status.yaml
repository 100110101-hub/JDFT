    修后实测：H2O/STO-3G/PBE **1.480e-7**、H2O/def2-SVP/PBE **1.589e-7**、HF 不变（1.138e-7）。
    判据 < 5e-6 由两条 `#[ignore]` 慢档测试守着（`g01_gradient_localize.rs`、
    `g01_analytic_def2svp.rs`，release 下 1–3 分钟）。详录 docs/choices.md 四十节。
    **仍未做**：Becke 权重导数的解析版本（现在是 O(δ²) 差分，δ = 1e-3 Bohr）。
