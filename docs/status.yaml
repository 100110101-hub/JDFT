  verification: |
    两项都已实现并验证：
    * **B88**（`GgaB88X`）：σ→0 退化为 Slater（< 1e-14 相对）、增强因子与闭式一致
      （< 1e-12）、导数对五点差分一致（1.1e-12…8.8e-11）。
    * **LYP**（`GgaLypC`）：三通道导数都对五点差分一致（d/dρ、d/dσ、d/dL）；
      均匀电子气极限 `ε_c = −a[1 + b·C_F·e^{−cρ^{−1/3}}]/(1+dρ^{−1/3})` 逐点相对差 < 1e-13。
    * **三通道的变分自洽**（`lyp_variational.rs`）：给密度矩阵加扰动 `ΔP = s·M`，
      `ΔE` 与 `Tr(v·ΔP)` 的残差随 s **线性**下降（3.4e-9 → 3.4e-11 → 3.4e-13）。
      这是整个三通道管线（含 `∇²(φ_μφ_ν)` 矩阵元）作为「真变分导数」的证明。
    公式常数：`a=0.04918, b=0.132, c=0.2533, d=0.349`；`C_F=(3/10)(3π²)^{2/3}`。
    等价的核对锚点：把 `Br = C_Fρ^{5/3} − 2t_W + (1/9)(t_W + ½∇²ρ)`（`t_W=(1/8)(σ/ρ−∇²ρ)`）
    展开得 `C_Fρ^{5/3} + (7/24)∇²ρ − (17/72)(σ/ρ)`，这两个系数与三个独立来源一致。
  note: |
    实现路径：`D`（对偶数）从两通道扩到三通道（`d_laplacian`），`potential_derivatives_laplacian`
    作为 trait 的**默认方法**（默认置零并转发两通道），所以只有 LYP 覆盖它；
    `ScaledTerm` 三通道用同一权重缩放；`evaluate_xc` 在 `requirements.laplacian` 为真时
    供给 `∇²ρ` 并加 `ρ∂ε/∂∇²ρ·∇²(φ_μφ_ν)` 的矩阵元。
    **上一轮判断对了**：如果按两通道实现 LYP，变分残差会是 O(1) 而不是 O(s)——这条测试就是那个闸门。
