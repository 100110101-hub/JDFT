    `hermite2e::primitive_component` 本来就吃任意幂次；② 球谐壳层先用 `T` 把密度展开到直角分量
    （`ρ̃ = Tᵀ P T`），在直角基上求导，再直接求和（梯度是标量）。
    核吸引里「核本身在动」那一项也不再需要显式闭式：`⟨a_A|−Z/r_C|b_B⟩` 只依赖 `A−C`、`B−C`，
    所以 `∂/∂C = −(∂/∂A + ∂/∂B)`（C 固定），右边正是已有能力。s 型的闭式仍保留，只给
    `g01_nuclear_derivative` 独立钉住它（它当初写错过）。
    新验收：`qwb-engine/tests/g01_analytic_water.rs`——H2O/STO-3G（**含 p**）的解析梯度 vs 数值梯度，
    最大分量差 6.7e-7 Ha/Bohr（数值参照自己在 δ=1e-3 与 4e-3 之间的散布是 9.3e-6，所以解析值
    落在参照的噪声里），平移不变性 1e-15。
    **过程中抓到的一个真 bug**：2e 的交换项槽位顺序是 `(ac|bd)`，我把索引换了位却忘了把**指数**
    一起换位，结果把 A 的指数配到 C 的中心上——误差 1.3e-1。修好后 6.7e-7。
