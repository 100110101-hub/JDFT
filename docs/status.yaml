    **2026-10-26 第三个缺口（网格自己也在动）。** 上面的 KS 解析梯度只补了"密度随核移动"，
    **没补**"网格随核移动"（Becke 权重导数 + 网格点位置导数）。它在 H2 上被对称性抹掉
    （所以 `g01_analytic_pbe` 一直是 8.4e-7），在 H2O/STO-3G/PBE 上是 **3.304e-4 Ha/Bohr**、
    H2O/def2-SVP/PBE 上 **2.282e-4**。四象限定位（HF vs PBE × STO-3G vs def2-SVP）证明
    **与 d 壳层无关**（def2-SVP 的 HF 是 1.138e-7）。修法：`rks_analytic_gradient_with_xc`
