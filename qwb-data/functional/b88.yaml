name: b88
version: 1.0.0
notes: 'B88 交换（Becke 1988）。只含交换，不含相关；LYP 相关项需要 ∇²ρ（网格上还没有），所以 B88/LYP 的完整 D-11 要等 laplacian 支持。闭壳层自旋求和约定：ρ 为总密度、σ = |∇ρ|²，x = sqrt(σ)/ρ^{4/3}，ε_x = ε_x^LDA·[1 + (β/C_x)x²/(1+6βx·asinh x)]。'
citation:
- title: Density-functional exchange-energy approximation with correct asymptotic behavior (Becke, Phys. Rev. A 38, 3098)
  doi: 10.1103/PhysRevA.38.3098
- title: Electron correlations by the Slater X-alpha method (Dirac-Slater LDA exchange, alpha = 2/3) —— 供 ε_x^LDA
  doi: 10.1103/PhysRev.140.A1133
