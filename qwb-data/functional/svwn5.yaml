name: svwn5
version: 1.0.0
notes: 'SVWN5 = Slater LDA exchange (alpha = 2/3) + VWN5 correlation (Vosko-Wilk-Nusair parameterization V, with spin interpolation / 自旋插值). Component ids: `LdaSlaterX` (exchange, an additive id against project.md 8.3''s table, which only lists the correlation term `LdaSvwn5`) and `LdaSvwn5` (VWN5 correlation). Parameterization V was identified numerically, not from memory: it reproduces the Ceperley-Alder paramagnetic uniform-gas correlation energy to ~1e-3 Ha across rs=1..20, while the VWN3/RPA parameter set (A=0.0310907, x0=-0.10498, b=3.72744, c=12.9352, which several online tables mislabel as VWN5) is off by ~1.7e-2 Ha. dEps/dSigma is identically zero for a pure LDA (requires.sigma = false).'
