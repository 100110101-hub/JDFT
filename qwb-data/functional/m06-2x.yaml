notes: 'M06-2X（Zhao & Truhlar 2008）：全局 hybrid meta-GGA，54% 精确交换 + 46% 的 M05 型半局域交换（0.46 已折进系数 a1，所以 MggaXM062x 的权重是 1.0，精确交换由 HfExchange 分量给）。交换无 VS98 项；相关与 M06-L 同一表达式、不同参数。逐点对照见 qwb-xc/tests/fx02_m06_exchange.rs。'
