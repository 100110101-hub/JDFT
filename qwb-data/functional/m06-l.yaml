sha256: 6894c5ebbee3b9608cba388ecc7f7bad0e91ac5881a53e89f6ee03f44487009d
name: m06-l
version: 1.0.0
notes: 'M06-L（Zhao & Truhlar 2006）：纯 meta-GGA（无精确交换），变量是 (ρ, σ, τ)。交换是 PBE 型增强因子乘一个 12 项动能级数，再加一个 VS98 的 gtv4 项；相关是 M05 + VSXC 两块，各自把 LSDA 相关按 Stoll 分解成同自旋/反自旋。参数逐项来自原文 Table，数值与 libxc 的 mgga_x_m06l/mgga_c_m06l 一致（逐点对照见 qwb-xc/tests/fx02_m06_exchange.rs）。'
citation:
- title: 'The M06 suite of density functionals for main group thermochemistry, thermochemical kinetics, noncovalent interactions, excited states, and transition elements: two new functionals and systematic testing of four M06-class functionals and 12 other functionals (Zhao & Truhlar, Theor. Chem. Acc. 120, 215)'
  doi: 10.1007/s00214-007-0310-x
- title: 'A new local density functional for main-group thermochemistry, transition metal bonding, thermochemical kinetics, and noncovalent interactions (Zhao & Truhlar, J. Chem. Phys. 125, 194101)'
  doi: 10.1063/1.2370993
