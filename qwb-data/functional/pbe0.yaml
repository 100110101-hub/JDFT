sha256: e741078195d85f7848d034487a6359c3e94164c2d11fe7efed2b082d18455f5a
name: pbe0
version: 1.0.0
notes: 'PBE0（Adamo & Barone 1999）：75% PBE 交换 + 25% 精确（HF）交换 + 100% PBE 相关。它在 hybrid 机制上等价于 B3LYP 的骨架（同样的 0.25 HF 混入），但不需要 LYP（LYP 要 ∇²ρ，网格侧还没有），所以拿它当 hybrid 机制的第一个验证体系：α=0 时必须逐位退化为 PBE，α=1 且 DFT 交换权重为 0 时必须逐位退化为 HF。HfExchange 不是一个能量密度项，而是一个混入比例，由 rks_from_data 读进 RksOptions.hf_exchange。'
citation:
- title: 'Toward reliable density functional methods without adjustable parameters: The PBE0 model (Adamo & Barone, J. Chem. Phys. 110, 6158)'
  doi: 10.1063/1.478522
- title: Generalized Gradient Approximation Made Simple (Perdew, Burke & Ernzerhof, Phys. Rev. Lett. 77, 3865)
  doi: 10.1103/PhysRevLett.77.3865
- title: 'Accurate spin-dependent electron liquid correlation energies for local spin density calculations: a critical analysis (Vosko, Wilk & Nusair, Can. J. Phys. 58, 1200)'
