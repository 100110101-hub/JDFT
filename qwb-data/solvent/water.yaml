notes: "DA-04 v1: dielectric constant, refractive index and temperature are the SMD/Truhlar
  values (Marenich-Cramer-Truhlar 2009, Table 1); atomic_radii are the Bondi (1964) van der
  Waals radii, declared explicitly through radii_set=bondi so no two radius conventions can be
  mixed silently. cavity_model=pcm keeps this entry usable by the C-PCM implementation (SV-01);
  switching a solvent to SMD needs the SMD-specific parameterised radii plus the four nonpolar
  terms (DA-05), which are NOT transcribed here."
