notes: 'DA-04 v1: dielectric constant and refractive index are the SMD solvent-table values (Marenich-Cramer-Truhlar 2009, Table 1, 298.15 K); atomic_radii are the Bondi (1964) van der Waals radii, declared through radii_set=bondi so no two radius conventions can be mixed silently. cavity_model=pcm keeps this entry usable by the C-PCM implementation (SV-01); switching to SMD needs the SMD parameterised radii and the four nonpolar terms (DA-05), which are NOT transcribed here. NIST handbook values differ in the third decimal for some solvents (e.g. acetonitrile 35.94 vs 35.69); this file stays on one source so all eight solvents are mutually consistent with water.yaml.'
