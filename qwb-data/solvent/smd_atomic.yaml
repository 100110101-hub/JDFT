name: smd-atomic
version: 1.0.0
kind: smd-atomic
notes: SMD 的 CDS（cavity dispersion solvent structure）项所需的元素级数据，从 PySCF 2.14.0 的 pyscf/lib/solvent/mnsol/mnsol.F 逐字提取（Apache-2.0），并用同一份 PySCF 的 libsolvent 验证：水相 sigma 最差 1.615e-5 cal/(mol A^2)、五个非水溶剂的 E_CDS 最差 3.797e-7 kcal/mol。三块内容：(1) CDS 的 vdW 半径（BONDI 表，H 取 Bondi 1964、其余取 Mantina 等 CRC 表）——注意它与 SMD 的“参数化半径”不是同一套（后者 C 1.85 / N 1.89 / O 依赖 Abraham alpha）；(2) 水相的逐元素 sigma（CSSIGM = 0）；(3) 非水相 sigma 由 sigma_N/sigma_A/sigma_B 与溶剂的 Abraham 描述符线性组合而成（外加与元素无关的 sigma_mol 常数项）。面积约定 A = 4*pi*(R + 0.4 A)^2 是反推并验证出来的（不是从论文抄的）：用 4*pi*R^2 时 sigma 会逐元素偏大 1.48~1.78 倍，加 0.4 A 后与官方回到 1e-7 相对以内。
citation:
- title: Universal solvation model based on solute electron density and on a continuum model of the solvent defined by the bulk dielectric constant and atomic surface tensions (SMD)
  doi: 10.1021/jp810292n
- title: Atomic radii of the elements (Mantina et al., CRC Handbook 2010-2011)
  doi: 10.1021/j100785a001
