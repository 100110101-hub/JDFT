sha256: 44962e541357f1246cb396096a763835deba1756f36e2ac9150882c075dd5e5b
name: dmso
version: 1.0.0
notes: "DA-04 v1: dielectric constant and refractive index are the SMD solvent-table
  values (Marenich-Cramer-Truhlar 2009, Table 1, 298.15 K); atomic_radii are the Bondi
  (1964) van der Waals radii, declared through radii_set=bondi so no two radius
  conventions can be mixed silently. cavity_model=pcm keeps this entry usable by the
  C-PCM implementation (SV-01); switching to SMD needs the SMD parameterised radii and
  the four nonpolar terms (DA-05), which are NOT transcribed here. NIST handbook values
  differ in the third decimal for some solvents (e.g. acetonitrile 35.94 vs 35.69); this
  file stays on one source so all eight solvents are mutually consistent with water.yaml."
citation:
  - title: "Universal solvation model based on solute electron density and on a continuum model of the solvent defined by the bulk dielectric constant and atomic surface tensions (SMD)"
    doi: "10.1021/jp810292n"
