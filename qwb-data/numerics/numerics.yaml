  commercial_ok: true
  redistribute_ok: true
created: 2026-11-06T10:00:00Z
levels:
- level: 1
  grid_level: grid-coarse
  description: Fastest. Coarse XC grid, PS collocation without de-aliasing.
  ps:
    collocation_points_per_atom: 30
    de_aliasing: false
- level: 2
  grid_level: grid-coarse
  description: Coarse grid, denser PS collocation, still no de-aliasing.
  ps:
    collocation_points_per_atom: 60
    de_aliasing: false
- level: 3
  grid_level: grid-normal
  description: Default. Normal XC grid; PS turns on de-aliasing (never turned off again).
  ps:
    collocation_points_per_atom: 90
    de_aliasing: true
- level: 4
  grid_level: grid-fine
  description: Fine XC grid, more PS collocation points.
  ps:
    collocation_points_per_atom: 120
    de_aliasing: true
- level: 5
  grid_level: grid-veryfine
  description: Most accurate. Very fine XC grid, densest PS collocation.
  ps:
    collocation_points_per_atom: 180
    de_aliasing: true
