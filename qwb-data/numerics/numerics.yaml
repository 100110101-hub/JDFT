sha256: f3b34d54231b2ac22190a4c072d21e14304565aa23f2cabd4ae251619343c543
equivalence_tolerance:
  ri: 0.0002
  pseudospectral: 0.00005
spectrum_defaults:
  gaussian_hwhm_ev: 0.4
  grid_step_ev: 0.05
  padding_hwhm: 6.0
name: numerics
version: 1.1.0
notes: 'K10 accuracy levels and equivalence tolerances (project-phase2.md 4.5 / 8.5). The LEVELS only BIND a grid level name to a pseudospectral configuration - the grid parameters themselves live in grid/*.yaml and are not duplicated here. The TOLERANCES are this project''s acceptance gates (not literature values): an approximation path is admitted only if its total energy matches the analytic path within these numbers, so changing one is a change of acceptance criteria and must bump the data version. PS collocation counts start at 30/atom with de-aliasing off and grow to 180/atom with de-aliasing on; K10 condition 2 (error decreases as the level rises) is asserted by VF-06 once IN-03 exists. `spectrum_defaults` is a PRESENTATION default for the UV/Vis broadening (PR-04): a Gaussian with the given half width at half maximum, a uniform energy grid step, and a padding of the plotting window in units of that half width. These are this project''s presentation choices (not literature values), so they live here to keep them out of the code and are versioned with the rest of the numerics data.'
citation:
- title: A multicenter numerical integration scheme for polyatomic molecules (Becke partitioning)
  doi: 10.1063/1.454033
- title: New Methods For Electronic Structure Calculations on Large Molecules (pseudospectral approach)
  doi: 10.1146/annurev.pc.42.100191.002013
