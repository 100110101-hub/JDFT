sha256: 150676400ae138f58900fa989ffdfd6c73c897bbb0693dc4e42aaea417d739b3
name: d4
version: 1.0.0
kind: d4
notes: 'DFT-D4 (Caldeweyher et al., J. Chem. Phys. 150, 154122 (2019)) parameters for H-Kr, extracted programmatically from the pinned upstream sources (dftd4 v4.3.1, multicharge v0.6.0; every file listed in provenance with its sha256). D4 differs from D3 in three ways that the loader must honour: (1) the damping is rational WITHOUT the zero-damping alp exponent -- two-body E = sum_{i<j} C6_ij [s6/(R^6+r0^6) + s8*rrij/(R^8+r0^8)] with r0 = a1*sqrt(rrij)+a2 and rrij = 3*r4r2_i*r4r2_j; alp is only the ATM three-body exponent; (2) C6 is NOT a tabulated element-pair value -- it is built at setup from the per-reference dynamic polarizabilities alpha(i*w) by a 3/pi*trapzd Casimir-Polder integration over the 23 frequencies stored here, so this file stores alpha_iw (not C6); (3) every reference weight carries the charge scaling zeta(ga, eta_i*gc, q_ref+zeff_i, q_i+zeff_i), so the model needs EEQ charges -- there are no s6q/s8q/a1q/a2q coefficients anywhere upstream. The ATM term uses C6 rebuilt with q = 0 (upstream disp.f90:139-141); using the molecular charges there is off by up to 30 percent. M06-2X has no D4 parameters upstream (v4.3.1 knows no such functional), so it is recorded under unsupported_functionals rather than given invented values.'
