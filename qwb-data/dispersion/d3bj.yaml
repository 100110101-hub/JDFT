sha256: 85607c132bef00c4a88ee143e8be4c6f6478abe1c892bd3498dc08289b7aebed
name: d3bj
version: 1.0.0
kind: d3bj
notes: D3(BJ) dispersion parameters for H-Kr, transcribed from the s-dftd3 sources listed in provenance (each file pinned by sha256). Per the D3 paper C6 from the 7x7 reference table interpolated with Gaussian weights on the fractional coordination number (kcn = 16, rcov = 4/3 Pyykko 2009), C8/C6 = 3*r4r2_i*r4r2_j, and rational (Becke-Johnson) damping r0 = a1*sqrt(C8/C6) + a2. C6 values are in Ha*Bohr^6; radii are the Pyykko single-bond covalent radii in Angstrom exactly as the upstream table stores them (metals already reduced by 10 percent), converted with the K2 BOHR_PER_ANGSTROM constant at load time. Only functionals with published BJ parameters are listed -- M06-L and M06-2X have no BJ entry upstream (zero damping only), so they are deliberately absent here.
citation:
- title: A consistent and accurate ab initio parametrization of density functional dispersion correction (DFT-D) for the 94 elements H-Pu
  doi: 10.1063/1.3382344
- title: Molecular Single-Bond Covalent Radii for Elements 1-118
  doi: 10.1002/chem.200800987
