version: 1.0.1
notes: 'Transcribed from the BSE export of LANL2DZ (revision 2013-03-25) for H, O, Cu, Zn. ECP parameters (Cu, Zn only) live in qwb-data/ecp/lanl2dz-{cu,zn}.yaml. Cu keeps 3s3p in the valence (10 core electrons, Hay-Wadt K..Au paper); Zn uses the [Ar] core (18 core, Hay-Wadt Sc..Hg paper); H and O are all-electron LANL2DZ valence bases (Hay-Wadt Na..Bi paper). Declared normalization=none: the exported contraction coefficients are NOT renormalized (measured <p|p> = 2.87 for Cu 3p under normalized primitives), so the loader normalizes once at load time (project.md 8.1). License: BSE export; the original papers do not state explicit commercial/redistribution terms, so both flags are false per project.md 14 #20 (strict reading).'
