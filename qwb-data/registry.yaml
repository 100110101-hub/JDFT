# DA-06：色散校正参数（D3(BJ)，H–Kr）。元素对参数是「参考 C6 表 + 参考 CN + 每元素
# 参考点个数 + CN 半径 + r4r2 + 阻尼参数」的一整套，缺一项都算不出 C6，所以只有一个
# 条目而不是每元素一条。
dispersions:
  - name: d3bj
    path: dispersion/d3bj.yaml
    sha256: 85607c132bef00c4a88ee143e8be4c6f6478abe1c892bd3498dc08289b7aebed
  # 零阻尼（D3(0)）：M06-L / M06-2X 在上游**只有这一套参数**（rs6 = 1.581 / 1.619、
  # s8 = 0），所以 M2 那条「M06-2X-D3」断言走的是这一份。它多带一张成对 vdW 半径表
  # （`R0_ij` 是查表值，不是两原子半径相加）。
  - name: d3zero
    path: dispersion/d3zero.yaml
    sha256: 28d0ad0091ecb9bbb35a016b2ba3b7e2b46e1d8b852dc3e53f61bf8f790b987a

# DFT-D4（Caldeweyher et al. 2019）：与 D3 是两套**数据形状** —— C6 不是元素对常量，而是每个
# 参考体系一对 alpha(iω)（23 个虚频）在加载时用 3/pi*trapzd 现算；每个参考权重带电荷缩放
# zeta(ga, eta_i*gc, q_ref+zeff_i, q_i+zeff_i)，所以 D4 需要 EEQ 电荷。因此它有独立的 K1 类型
# （`d4dispersion.schema.*`）与独立的 section。M06-2X 在上游没有 D4 参数，记在文件里的
# `unsupported_functionals`，不编造数值。
d4_dispersions:
  - name: d4
    path: dispersion/d4.yaml
    sha256: 150676400ae138f58900fa989ffdfd6c73c897bbb0693dc4e42aaea417d739b3

# 元素级 SMD 数据（SV-03）：CDS 的 vdW 半径（BONDI/Mantina）、水相逐元素表面张力 sigma、
# 非水相 sigma 的三张表 + 四个常数项、面积约定 A = 4*pi*(R+0.4)^2（该偏移是反推并验证的，
# 不是从论文抄的），以及 `SMXCDS` 的成键接触规则（15×15 的 `RKKVAL` 参考键长 + `NATCNV`
# 元素类型）。**与 SMD 的参数化半径不是同一套**，所以单独一个文件与类型，
# 不抄进 8 个溶剂文件（见 docs/choices.md 一百六十二）。
smd_atomics:
