# T5 的 CuH 体系（冻结）：LANL2DZ 价基 + LANL2DZ ECP（Cu 10 core / z_eff 19）。
# 几何取实验附近的 Cu–H = 1.46 Å（LANL2DZ/PBE 会在这一带）。
molecule:
  atoms:
    - symbol: Cu
      position_angstrom: [0.0, 0.0, 0.0]
    - symbol: H
      position_angstrom: [0.0, 0.0, 1.46]
  charge: 0
  multiplicity: 1
basis_name: lanl2dz
method_name: pbe
grid_level: normal
solvent: vacuum
jobtype: sp
options:
  scf_max_iter: 200
  scf_energy_threshold_hartree: 1.0e-8
  scf_density_threshold: 1.0e-6
  diis_history: 8
  threads: 0
  max_opt_steps: 100
  opt_gradient_threshold_hartree_per_bohr: 4.5e-4
  freq_step_angstrom: 0.01
  ecp_name: lanl2dz-cu
