# T5 的 ZnO 体系（冻结后按实际数据更正：def2-ECP 对 Zn 不存在，见 docs/status.yaml 的 D-07/T5）：
# ZnO / LANL2DZ 价基 + LANL2DZ ECP（Zn 18 core / z_eff 12；O 全电子）。
molecule:
  atoms:
    - symbol: Zn
      position_angstrom: [0.0, 0.0, 0.0]
    - symbol: O
      position_angstrom: [0.0, 0.0, 1.70]
  charge: 0
  multiplicity: 1
basis_name: lanl2dz
method_name: pbe
grid_level: normal
solvent: vacuum
jobtype: sp
options:
  scf_max_iter: 200
  scf_energy_threshold_hartree: 1.0e-8
  scf_density_threshold: 1.0e-6
  diis_history: 8
  threads: 0
  max_opt_steps: 100
  opt_gradient_threshold_hartree_per_bohr: 4.5e-4
  freq_step_angstrom: 0.01
  ecp_name: lanl2dz-zn
