# M3 / SC-05：H2O / def2-SVP 的 RI-MP2 相关能（辅助基 def2-SVP-RI）。
#
# 参考值由 PySCF 2.14.0 给出（`scripts/pyscf_rimp2_reference.py`，同一几何）：
#   E_HF              = -75.9609699902 Ha
#   E_corr(canonical) = -0.2036434634 Ha
#   E_corr(RI-MP2)    = -0.2035582026 Ha     （拟合误差 8.53e-5 Ha）
#
# 引擎会**同时**算一遍 canonical（用同一份 4 中心张量）来填 `ri_error_hartree`
# —— 近似必须留痕（K10 第 ③ 条）。所以这个作业的时间不是 RI 内核的净耗时。
#
# 运行：qwb run examples/h2o_ri_mp2_def2svp.yaml
molecule:
  atoms:
    - symbol: O
      position_angstrom: [0.0, 0.0, 0.11779]
    - symbol: H
      position_angstrom: [0.0, 0.75545, -0.47116]
    - symbol: H
      position_angstrom: [0.0, -0.75545, -0.47116]
  charge: 0
  multiplicity: 1
basis_name: def2-svp
method_name: hf
grid_level: normal
solvent: vacuum
jobtype: sp
options:
  scf_max_iter: 200
  scf_energy_threshold_hartree: 1.0e-10
  scf_density_threshold: 1.0e-9
  diis_history: 8
  threads: 0
  max_opt_steps: 100
  opt_gradient_threshold_hartree_per_bohr: 4.5e-4
  freq_step_angstrom: 0.01
  ecp_name: null
  mp2:
    kind: ri-mp2
    aux_basis_name: def2-svp-ri
