# M3 / SC-04：H2O / def2-SVP 的 canonical MP2 相关能。
#
# 参考值由 PySCF 2.14.0 的 `scf.RHF` + `mp.MP2`（无冻结核、同一几何）给出：
#   E_HF   = -75.9609699902 Ha
#   E_corr = -0.2036434634 Ha
#   E_MP2  = -76.1646134536 Ha
# 本引擎要求参考态与相关能来自**同一个基组与同一份 2e 张量**，所以这里不带
# `scf_type`（缺省即闭壳层 RHF/RKS），只在 options 里打开 MP2。
#
# 运行：qwb run examples/h2o_mp2_def2svp.yaml
# 结果：results/<时间戳>/result.json 里的 `correlation` 块
molecule:
  atoms:
    - symbol: O
      position_angstrom: [0.0, 0.0, 0.11779]
    - symbol: H
      position_angstrom: [0.0, 0.75545, -0.47116]
    - symbol: H
      position_angstrom: [0.0, -0.75545, -0.47116]
  charge: 0
  multiplicity: 1
basis_name: def2-svp
method_name: hf
grid_level: normal
solvent: vacuum
jobtype: sp
options:
  scf_max_iter: 200
  scf_energy_threshold_hartree: 1.0e-10
  scf_density_threshold: 1.0e-9
  diis_history: 8
  threads: 0
  max_opt_steps: 100
  opt_gradient_threshold_hartree_per_bohr: 4.5e-4
  freq_step_angstrom: 0.01
  ecp_name: null
  mp2:
    kind: mp2
