# M1b：O2 三重态 / STO-3G / UKS（自旋极化 PBE）。
#
# 判据（project-phase2.md §7 M1b）：
#   E = -148.1377187 Ha（PySCF UKS/PBE 同值，差 < 1e-6；
#      参考行在 qwb-core/crates/qwb-scf/tests/reference/uks_open_shell.csv）
#   <S^2> = 2.000392（UKS 的近纯三重态；污染量落进 result.json 的 spin 块）
#   n_alpha = 9, n_beta = 7
#
# 几何与 `scripts/pyscf_uks_reference.py` 逐字一致（R = 1.208 Å）。
# UKS 需要 XC 网格，所以 grid_level 用 normal（UHF 那条路径不碰网格）。
molecule:
  atoms:
    - symbol: O
      position_angstrom: [0.0, 0.0, 0.0]
    - symbol: O
      position_angstrom: [0.0, 0.0, 1.208]
  charge: 0
  multiplicity: 3
basis_name: sto-3g
method_name: pbe
grid_level: fine
solvent: vacuum
jobtype: sp
options:
  scf_max_iter: 300
  scf_energy_threshold_hartree: 1.0e-8
  scf_density_threshold: 1.0e-6
  diis_history: 8
  threads: 0
  max_opt_steps: 100
  opt_gradient_threshold_hartree_per_bohr: 4.5e-4
  freq_step_angstrom: 0.01
  ecp_name: null
  scf_type: uks
