[package]
name = "qwb-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "QWB 引擎顶层：把注册表数据接到 SCF 上，实现 K2 的 EngineBackend"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
qwb-basis.workspace = true
qwb-linalg.workspace = true
qwb-integrals.workspace = true
qwb-registry.workspace = true
qwb-engine-api.workspace = true
qwb-scf.workspace = true
qwb-props.workspace = true
qwb-response.workspace = true
qwb-grid.workspace = true
qwb-xc.workspace = true
rayon.workspace = true
nalgebra.workspace = true
# EX-03：网格 XC 的设备后端（`gpu-kernel` 下注入给 `qwb-scf`）。默认关，构建期不参与。
qwb-gpu = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# EX-03：把 `qwb-gpu` 的网格 XC 收缩器接到产品 SCF 上（`RksBackend::with_xc_grid_gpu`）。
# 默认**关**：默认构建里 `qwb-gpu` 既不编译也不链接，产品路径与 CPU 位模式一字不变。
gpu-kernel = ["dep:qwb-gpu", "qwb-gpu/gpu-kernel"]
