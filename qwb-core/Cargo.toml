[workspace]
resolver = "3"
members = ["crates/qwb-registry", "crates/qwb-io", "crates/qwb-cli", "crates/qwb-linalg", "crates/qwb-basis", "crates/qwb-integrals", "crates/qwb-xc", "crates/qwb-scf", "crates/qwb-grid"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://example.invalid/qwb-core"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
nalgebra = "0.35"
# R-11：faer 是 qwb-linalg 的可选后端（`--no-default-features --features faer`）。
faer = "0.24"
proptest = "1"
qwb-engine-api = { path = "../qwb-contracts/engine-api" }
qwb-registry = { path = "crates/qwb-registry" }
qwb-io = { path = "crates/qwb-io" }
qwb-cli = { path = "crates/qwb-cli" }
qwb-linalg = { path = "crates/qwb-linalg" }
qwb-basis = { path = "crates/qwb-basis" }
qwb-integrals = { path = "crates/qwb-integrals" }
qwb-xc = { path = "crates/qwb-xc" }
qwb-scf = { path = "crates/qwb-scf" }
qwb-grid = { path = "crates/qwb-grid" }

# G6：workspace 级禁 unsafe、强制文档。crate 用 `[lints] workspace = true` 继承。
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
todo = "warn"
pedantic = { level = "allow", priority = -1 }
